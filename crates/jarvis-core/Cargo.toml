[package]
name = "jarvis-core"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
once_cell.workspace = true
log.workspace = true
rand.workspace = true
seqdiff.workspace = true
hound.workspace = true
platform-dirs.workspace = true
rodio.workspace = true
kira.workspace = true
pv_recorder.workspace = true
rustpotter.workspace = true
parking_lot.workspace = true
toml.workspace = true
sha2.workspace = true
nnnoiseless = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
fluent.workspace = true
fluent-bundle.workspace = true
unic-langid.workspace = true
chrono.workspace = true
flate2 = "1.1"
sys-locale.workspace = true
jarvis-license = { path = "../jarvis-license" }
ed25519-dalek = { version = "2" }

# pv_recorder = { workspace = true, optional = true }
vosk = { version = "0.3.1", optional = true }
intent-classifier = { version = "0.1.0", optional = true }
# rustpotter = { workspace = true, optional = true }

tokio = { version = "1", features = ["sync"], optional = true }

mlua = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tempfile.workspace = true

fastembed = { workspace = true, optional = true }
ort = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
opus-decoder = "0.1.1"
ogg = "0.9.2"
opus-rs = "0.1.37"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["shellapi", "winuser", "sysinfoapi", "fileapi", "processthreadsapi", "winnt", "combaseapi", "objbase", "mmdeviceapi", "endpointvolume", "winerror", "objidl", "unknwnbase", "handleapi", "winbase", "minwindef", "dpapi", "wincrypt", "wingdi", "libloaderapi", "synchapi", "errhandlingapi", "winreg", "shlobj", "knownfolders", "fileapi", "tlhelp32", "iphlpapi", "iptypes", "ws2def", "inaddr", "ifdef", "nldef", "ipifcons", "psapi", "jobapi2", "playsoundapi", "mmsystem", "aclapi", "accctrl", "sddl", "securitybaseapi", "commdlg", "evntrace", "evntcons", "guiddef", "wmistr"] }
winrt-notification = { workspace = true, optional = true }

[build-dependencies]
sha2.workspace = true

[features]
# Jarvis User (the customer's program): the levels of resources/access.toml are enforced. Without it: Jarvis Admin.
user-edition = []
default = ["jarvis_app"]
jarvis_app = [
    "vosk", "intent-classifier", "fastembed", "tokio", "nnnoiseless", "tokio-tungstenite", "futures-util",
    "lua",
    "ort", "ndarray", "tokenizers", "regex",]

intent = ["intent-classifier", "tokio"]
lua = ["mlua", "reqwest", "winrt-notification"]
# the video card (DirectML) for the aim assist: off in the builds, because it was not tried on real hardware (see docs/GAME-MODE.md)
directml = ["ort/directml"]
lua_only = ["lua", "tokio"]

[dev-dependencies]
jarvis-license-server = { path = "../jarvis-license-server" }
base64 = "0.22"

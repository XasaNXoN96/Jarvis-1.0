[package]
name = "jarvis-app"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
jarvis-core = { path = "../jarvis-core", features = ["intent"] }
once_cell.workspace = true
log.workspace = true
simple-log = "2.4"
tray-icon = "0.21"
winit = "0.30"
image.workspace = true
platform-dirs.workspace = true
rand.workspace = true
parking_lot.workspace = true

tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(windows)'.dependencies.winit]
version = "0.30"
features = []

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winuser", "wincon"] }
# the own window of Jarvis (WebView2): the cross asks "tray / exit / cancel", the tray hides and shows it
tao = "0.34"
wry = "0.53"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
glib = "0.21.5"

[build-dependencies]
winresource = "0.1"

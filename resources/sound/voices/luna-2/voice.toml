[voice]
id = "luna-2"
name = "Luna 2.0"
author = "Luna"
languages = ["ru"]

[reactions.ru]
# app startup
greet = ["greet1"]
greet_morning = ["greet_morning"]
greet_day = ["greet_day"]
greet_evening = ["greet_evening"]
greet_night = ["greet_night"]

# wake word
reply = ["reply1", "reply2", "reply3", "reply4", "reply5", "reply6"]

# command executed

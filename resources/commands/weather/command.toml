[[commands]]
id = "weather"
type = "lua"
triggers.ru = ["погод"]
triggers.en = ["weather"]
script = "script.lua"
timeout = 20000
sandbox = "standard"

[commands.phrases]
ru = ["какая погода в {city}", "погода {city}"]
en = ["what's the weather in {city}", "weather in {city}"]

[commands.sounds]
ru = ["weather_ru_1", "weather_ru_2"]
en = ["weather_en_1", "weather_en_2"]



[[commands]]
id = "set_city"
type = "lua"
triggers.ru = ["установ город","смен город","измен город","мой город"]
triggers.en = ["set city","change city","my city"]
script = "set_city.lua"
sandbox = "standard"
timeout = 5000
phrases.ru = [
    "установи город",
]
phrases.en = [
    "set city",
    "change city",
]
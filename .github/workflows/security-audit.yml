name: Security audit

# The audit of the dependencies of Rust (RustSec database) and a check that no key or password was committed. It is a separate workflow:
# a finding is a red mark on its own and never stops the build of the installers.
on:
  push:
    branches: [main, "dev/**"]
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - ".github/workflows/security-audit.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # exit code: 0 = no known vulnerability (warnings about unmaintained, unsound or yanked crates are listed, they do not fail); 1 = a vulnerability.
      # The advisories that were accepted for a written reason are in .cargo/audit.toml.
      - name: Audit Cargo.lock
        run: |
          set +e
          cargo audit 2>&1 | tee audit.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then echo "::error title=cargo-audit::known vulnerabilities, see the log above"; fi
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cargo-audit-report
          path: audit.txt

  secrets-in-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No private key, token or password in the files of the repository
        shell: bash
        run: |
          set -e
          bad=0
          # a private key block, a token of a known service, a long key of an AI provider
          if git grep -nIE -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' -e 'ghp_[A-Za-z0-9]{36}' -e 'AKIA[0-9A-Z]{16}' -e 'xox[bp]-[A-Za-z0-9-]{20,}' -e 'AIza[0-9A-Za-z_-]{35}' -- . ':!*.md' ':!.github/workflows/*' ':!crates/**/tests*' ':!crates/**/*tests.rs' ; then
            echo "::error::a secret looks committed (see above)"; bad=1
          fi
          # no key file may be committed at all (the old sideload key was removed from the tree on 23.10.2026; it stays only in the history)
          extra="$(git ls-files | grep -iE '\.(jks|keystore|p12|pfx)$' || true)"
          if [ -n "$extra" ]; then echo "::error::a key file is committed: $extra"; bad=1; fi
          exit $bad

name: Build Windows installer

on:
  workflow_dispatch:
  push:
    # main: tests + installers + release "build-latest"; dev/*: the same tests and build as a check, without a release
    branches: [main, "dev/**"]
    paths-ignore:
      - "README.md"

permissions:
  contents: write

jobs:
  # automated tests of jarvis-core on Windows; the installers are built meanwhile, but a failure stops the publication
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests (jarvis-core)
        shell: pwsh
        run: |
          $env:LIB = "$PWD\lib\windows\amd64;$env:LIB"
          $env:PATH = "$PWD\lib\windows\amd64;$env:PATH"
          cargo test -p jarvis-core --no-fail-fast 2>&1 | Tee-Object -FilePath test.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # the reason goes into an annotation: it is visible on the run page and through the API without signing in
            $found = Select-String -Path test.log -Pattern 'error(\[E\d+\])?:|panicked|FAILED|failures:|test result' -Context 0,4 | Select-Object -First 40
            $text = ($found | ForEach-Object { $_.Line; $_.Context.PostContext }) -join "`n"
            if ($text.Length -gt 30000) { $text = $text.Substring(0, 30000) }
            $text = $text.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            Write-Output "::error title=cargo test::$text"
            exit $code
          }

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build jarvis-app (release)
        shell: pwsh
        run: |
          $env:LIB = "$PWD\lib\windows\amd64;$env:LIB"
          cargo build --release -p jarvis-app

      - name: Assemble program folder
        shell: pwsh
        run: |
          $out = "build\Jarvis"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item target\release\jarvis-app.exe $out
          Copy-Item lib\windows\amd64\*.dll $out
          foreach ($d in "commands", "sound", "keywords", "rustpotter") {
            Copy-Item "resources\$d" "$out\resources\$d" -Recurse
          }
          New-Item -ItemType Directory -Force "$out\resources\vosk" | Out-Null
          Copy-Item resources\vosk\README.md "$out\resources\vosk"
          Get-ChildItem $out -Recurse | Measure-Object -Property Length -Sum

      # Lite installer: Windows built-in voices only
      - name: Build lite installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          New-Item -ItemType Directory -Force dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DSrcDir=build\Jarvis /DOutName=Jarvis-Setup-Lite installer\jarvis.iss 2>&1 | Tee-Object -FilePath iscc-lite.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Full installer: adds the Piper neural voice (offline). Change the voice names to switch voices:
      # list and samples: https://rhasspy.github.io/piper-samples/
      - name: Add Piper neural voices
        id: piper
        continue-on-error: true
        shell: pwsh
        env:
          PIPER_RU_VOICE: ru_RU-irina-medium
          PIPER_EN_VOICE: en_US-amy-medium
        run: |
          $ErrorActionPreference = "Stop"
          Copy-Item build\Jarvis build\JarvisFull -Recurse
          $piper = "build\JarvisFull\piper"
          Invoke-WebRequest "https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_windows_amd64.zip" -OutFile piper.zip
          Expand-Archive piper.zip -DestinationPath build\JarvisFull
          New-Item -ItemType Directory -Force "$piper\voices" | Out-Null
          foreach ($pair in @(@("ru", $env:PIPER_RU_VOICE), @("en", $env:PIPER_EN_VOICE))) {
            $lang = $pair[0]; $name = $pair[1]
            # ru_RU-irina-medium -> ru/ru_RU/irina/medium/ru_RU-irina-medium
            $parts = $name -split "-"
            $base = "https://huggingface.co/rhasspy/piper-voices/resolve/main/$($parts[0].Split('_')[0])/$($parts[0])/$($parts[1])/$($parts[2])/$name"
            Invoke-WebRequest "$base.onnx" -OutFile "$piper\voices\$lang.onnx"
            Invoke-WebRequest "$base.onnx.json" -OutFile "$piper\voices\$lang.onnx.json"
            # model card with the voice license: keep it next to the voice and show it in the log
            try {
              $card = "https://huggingface.co/rhasspy/piper-voices/raw/main/$($parts[0].Split('_')[0])/$($parts[0])/$($parts[1])/MODEL_CARD"
              Invoke-WebRequest $card -OutFile "$piper\voices\$lang.MODEL_CARD.txt"
              Write-Host "=== MODEL CARD $name ==="
              Get-Content "$piper\voices\$lang.MODEL_CARD.txt"
            } catch { Write-Host "no model card for $name" }
          }
          Get-ChildItem $piper -Recurse | Measure-Object -Property Length -Sum

      # Speech recognition model (Vosk, Russian) taken from the release v0.1 archive (jarvis-master.zip)
      # so nobody has to copy model folders by hand. Change VOSK_MODELS to add English / Ukrainian.
      - name: Add Vosk speech model
        id: vosk
        if: steps.piper.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        env:
          VOSK_MODELS: vosk-model-small-ru-0.22
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          Invoke-WebRequest "https://github.com/${{ github.repository }}/releases/download/v0.1/jarvis-master.zip" -OutFile models.zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("$PWD\models.zip")
          $dstRoot = "$PWD\build\JarvisFull\resources\vosk"
          New-Item -ItemType Directory -Force $dstRoot | Out-Null
          $count = 0
          foreach ($model in $env:VOSK_MODELS.Split(",")) {
            $prefix = "jarvis-master/resources/vosk/$($model.Trim())/"
            foreach ($entry in $zip.Entries) {
              if ($entry.FullName.StartsWith($prefix) -and $entry.Name -ne "") {
                $target = Join-Path $dstRoot $entry.FullName.Substring("jarvis-master/resources/vosk/".Length)
                New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
                [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $target, $true)
                $count++
              }
            }
          }
          $zip.Dispose()
          Remove-Item models.zip
          Write-Host "Vosk files extracted: $count"
          if ($count -eq 0) { throw "model not found in the archive" }
          Get-ChildItem $dstRoot | Format-Table Name

      - name: Build full installer
        if: steps.piper.outcome == 'success'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DSrcDir=build\JarvisFull /DOutName=Jarvis-Setup installer\jarvis.iss 2>&1 | Tee-Object -FilePath iscc-full.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Without Piper the lite installer is the only one
        if: steps.piper.outcome != 'success'
        shell: pwsh
        run: Copy-Item dist\Jarvis-Setup-Lite.exe dist\Jarvis-Setup.exe

      # tiny update for already installed copies: new / changed commands only
      - name: Pack commands update
        shell: pwsh
        run: Compress-Archive -Path resources\commands -DestinationPath dist\commands-update.zip -Force

      - name: List dist
        shell: pwsh
        run: Get-ChildItem dist | Format-Table Name, Length

      - name: Upload dist folder
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      # the program alone, for the release (the publish job runs on another machine)
      - name: Upload jarvis-app.exe
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-app
          path: build/Jarvis/jarvis-app.exe

      # the checks run after the upload: the installers stay downloadable even when a check fails
      # both installers are compiled with the Russian and the English language files (the language dialog)
      - name: Check installer languages
        shell: pwsh
        run: |
          $logs = @(Get-ChildItem iscc-*.log)
          if ($logs.Count -eq 0) { Write-Output "::error title=installer::no ISCC output to check"; exit 1 }
          foreach ($log in $logs) {
            $text = Get-Content $log -Raw
            # the [Languages] entries as ISCC reads them ("Reading file: ...\Default.isl" is the English entry; the line
            # "Reading default messages from Default.isl" is printed always and does not count)
            foreach ($isl in "Reading file:.*\\Languages\\Russian\.isl", "Reading file:.*\\Default\.isl") {
              if ($text -notmatch $isl) { Write-Output "::error title=installer::$($log.Name): $isl is not compiled in"; exit 1 }
            }
            if ($text -notmatch "Successful compile") { Write-Output "::error title=installer::$($log.Name): no successful compile"; exit 1 }
            Write-Host "$($log.Name): Russian.isl and Default.isl compiled in"
            Select-String -Path $log -Pattern "\[Languages\]|\.isl" | Select-Object -First 8 | ForEach-Object { "  " + $_.Line }
          }

      # The full installer into a folder with spaces and Cyrillic letters (in English): the program, the Piper voice and
      # the speech model are really installed; then the uninstaller removes the program folder.
      # (innoextract 1.9 does not read the Inno Setup 6.7 format, so the contents are checked by installing.)
      - name: Full installer - install into a Cyrillic path and uninstall
        if: steps.piper.outcome == 'success'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir = "C:\Jarvis Тест Full"
          $p = Start-Process dist\Jarvis-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LANG=english", "/DIR=`"$dir`"", "/LOG=$PWD\install-full.log" -PassThru -Wait
          Write-Host "installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Get-Content install-full.log -Tail 30; throw "silent install failed" }
          $need = @("jarvis-app.exe", "piper\piper.exe", "piper\voices\ru.onnx", "piper\voices\en.onnx", "resources\commands", "resources\vosk\vosk-model-small-ru-0.22", "unins000.exe")
          if ("${{ steps.vosk.outcome }}" -ne "success") { $need = $need | Where-Object { $_ -notlike "*vosk-model*" }; Write-Host "::warning::the full installer was built without the Vosk model" }
          foreach ($f in $need) {
            if (-not (Test-Path -LiteralPath (Join-Path $dir $f))) { throw "not installed: $f" }
            Write-Host "installed: $f"
          }
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Jarvis" -Filter *.lnk | ForEach-Object { $_.Name }
          Write-Host "Start menu: $($lnk -join ', ')"
          if (@($lnk).Count -lt 2) { throw "the Start menu shortcuts are missing" }
          # uninstall while Jarvis runs in the tray and autostart was switched on from its settings
          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          Set-ItemProperty -Path $runKey -Name "Jarvis" -Value "`"$dir\jarvis-app.exe`" --background"
          $app = Start-Process (Join-Path $dir "jarvis-app.exe") -ArgumentList "--background" -WorkingDirectory $dir -PassThru
          Start-Sleep 8
          # the secrets of the user (the Telegram token, the phone link) must go with the program; the rest stays
          $data = Join-Path $env:APPDATA "com.priler.jarvis"
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          Set-Content -LiteralPath (Join-Path $data "telegram.json") -Value '{"token":"dpapi:00"}'
          Set-Content -LiteralPath (Join-Path $data "remote_token") -Value "0123456789abcdef0123456789abcdef"
          Set-Content -LiteralPath (Join-Path $data "ci-keep.txt") -Value "kept"
          $u = Start-Process (Join-Path $dir "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru -Wait
          Write-Host "uninstaller exit code: $($u.ExitCode)"
          # the uninstaller finishes in a copy of itself: a few seconds
          for ($i = 0; $i -lt 30 -and (Test-Path -LiteralPath (Join-Path $dir "jarvis-app.exe")); $i++) { Start-Sleep 1 }
          if (Test-Path -LiteralPath (Join-Path $dir "jarvis-app.exe")) { throw "the uninstaller left jarvis-app.exe" }
          Write-Host "uninstalled: the program is removed"
          if (-not $app.WaitForExit(10000)) { $app.Kill(); throw "the uninstaller left Jarvis running" }
          if ((Get-ItemProperty -Path $runKey -ErrorAction SilentlyContinue).PSObject.Properties.Name -contains "Jarvis") { throw "the autostart entry stayed after uninstall" }
          Write-Host "uninstalled: Jarvis was ended and the autostart entry removed"
          foreach ($f in "telegram.json", "remote_token") { if (Test-Path -LiteralPath (Join-Path $data $f)) { throw "the uninstaller left the secret $f" } }
          if (-not (Test-Path -LiteralPath (Join-Path $data "ci-keep.txt"))) { throw "a silent uninstall deleted the user's data without asking" }
          Write-Host "uninstalled: the secrets are removed, the other data of the user is kept (silent uninstall)"

      # The Lite installer is installed silently and the installed Jarvis is started on the CI machine: its page server
      # answers, a second start does not leave a second process, the window is asked to show, and the full exit ends the
      # process. (The CI machine has no microphone and no user at the screen: the voice is not checked here.)
      - name: Smoke test of the installed Jarvis
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir = "C:\JarvisSmoke"
          $p = Start-Process dist\Jarvis-Setup-Lite.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LANG=russian", "/DIR=$dir", "/LOG=$PWD\install.log" -PassThru -Wait
          Write-Host "installer exit code: $($p.ExitCode)"
          Get-Content install.log -TotalCount 12
          if ($p.ExitCode -ne 0) { throw "silent install failed" }
          foreach ($f in "jarvis-app.exe", "resources\commands", "unins000.exe") {
            if (-not (Test-Path "$dir\$f")) { throw "not installed: $f" }
          }
          $app = Start-Process "$dir\jarvis-app.exe" -WorkingDirectory $dir -PassThru
          $up = $false
          for ($i = 0; $i -lt 90 -and -not $up; $i++) {
            Start-Sleep 1
            try { $state = Invoke-RestMethod http://127.0.0.1:9714/state -TimeoutSec 3; $up = $true } catch {}
            if ($app.HasExited) { throw "jarvis-app ended at start, exit code $($app.ExitCode)" }
          }
          if (-not $up) { throw "the page server did not answer in 90 s" }
          Write-Host "page server answers; voice: $($state.voice_state.state) - $($state.voice_state.detail)"
          $h = @{ "X-Jarvis" = "1" }
          # a second start: shows the running window and ends, no second Jarvis stays
          $second = Start-Process "$dir\jarvis-app.exe" -WorkingDirectory $dir -PassThru
          if (-not $second.WaitForExit(40000)) { $second.Kill(); throw "the second start did not end" }
          $count = @(Get-Process jarvis-app -ErrorAction SilentlyContinue).Count
          Write-Host "second start ended (exit code $($second.ExitCode)); jarvis-app processes: $count"
          if ($count -ne 1) { throw "expected one jarvis-app process, found $count" }
          $r = Invoke-RestMethod http://127.0.0.1:9714/action -Method Post -Headers $h -Body '{"name":"show_window"}'
          Write-Host "show_window: $($r | ConvertTo-Json -Compress)"
          # "Свернуть в трей" (the same way as the tray menu): Jarvis keeps running
          $r = Invoke-RestMethod http://127.0.0.1:9714/action -Method Post -Headers $h -Body '{"name":"hide_window"}'
          Write-Host "hide_window: $($r | ConvertTo-Json -Compress)"
          Start-Sleep 2
          if ($app.HasExited) { throw "Jarvis ended after the window requests" }
          # the pages added later, on the installed Jarvis: tasks (a real file in Documents), messages, Telegram
          $t = Invoke-RestMethod http://127.0.0.1:9714/tasks -TimeoutSec 5
          $before = @($t.tasks).Count
          $mark = "ci-проверка $(Get-Random)"
          $r = Invoke-RestMethod http://127.0.0.1:9714/tasks -Method Post -Headers $h -Body ([Text.Encoding]::UTF8.GetBytes((@{ op = "add"; text = $mark } | ConvertTo-Json -Compress))) -ContentType "application/json; charset=utf-8"
          if (-not $r.ok) { throw "tasks add failed: $($r.message)" }
          $t = Invoke-RestMethod http://127.0.0.1:9714/tasks -TimeoutSec 5
          if (@($t.tasks) -notcontains $mark) { throw "the added task is not in the list" }
          $file = Get-Content -LiteralPath $t.path -Encoding UTF8 -Raw
          if ($file -notlike "*$mark*") { throw "the task is not in the file $($t.path)" }
          $i = [array]::IndexOf(@($t.tasks), $mark)
          $r = Invoke-RestMethod http://127.0.0.1:9714/tasks -Method Post -Headers $h -Body ([Text.Encoding]::UTF8.GetBytes((@{ op = "remove"; index = $i; old = $mark } | ConvertTo-Json -Compress))) -ContentType "application/json; charset=utf-8"
          if (-not $r.ok -or @((Invoke-RestMethod http://127.0.0.1:9714/tasks).tasks).Count -ne $before) { throw "tasks remove failed" }
          Write-Host "tasks: added and removed in $($t.path)"
          try { Invoke-RestMethod http://127.0.0.1:9714/tasks -Method Post -Body '{"op":"clear"}' | Out-Null; throw "tasks clear without the header was accepted" } catch { if ($_.Exception.Message -like "*without the header*") { throw } }
          $m = Invoke-RestMethod http://127.0.0.1:9714/messages -TimeoutSec 5
          if (@($m.networks).Count -ne 11) { throw "expected 11 networks, got $(@($m.networks).Count)" }
          $tg = Invoke-RestMethod http://127.0.0.1:9714/telegram -TimeoutSec 5
          Write-Host "messages: $(@($m.messages).Count), networks: $(@($m.networks).Count); telegram: enabled=$($tg.enabled) available=$($tg.available)"
          if ($tg.enabled) { throw "the Telegram bot must be off by default" }
          # without the X-Jarvis header nothing is done (a web page cannot close Jarvis)
          try { Invoke-RestMethod http://127.0.0.1:9714/action -Method Post -Body '{"name":"app_exit"}' | Out-Null; throw "app_exit without the header was accepted" } catch { if ($_.Exception.Message -like "*without the header*") { throw } }
          Start-Sleep 1
          if ($app.HasExited) { throw "Jarvis ended on a request without the header" }
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $r = Invoke-RestMethod http://127.0.0.1:9714/action -Method Post -Headers $h -Body '{"name":"app_exit"}'
          Write-Host "app_exit: $($r | ConvertTo-Json -Compress)"
          if (-not $app.WaitForExit(15000)) { throw "Jarvis did not end after the full exit" }
          Write-Host "Jarvis ended after the full exit in $([int]$sw.Elapsed.TotalMilliseconds) ms, exit code $($app.ExitCode)"
          if ($sw.Elapsed.TotalSeconds -gt 5) { Write-Output "::warning title=exit::the full exit took $([int]$sw.Elapsed.TotalSeconds) s" }
          if (@(Get-Process jarvis-app -ErrorAction SilentlyContinue).Count -ne 0) { throw "a jarvis-app process is still running" }
          # an update over a running Jarvis (it may sit hidden in the tray): the installer closes it and installs
          $app = Start-Process "$dir\jarvis-app.exe" -ArgumentList "--background" -WorkingDirectory $dir -PassThru
          for ($i = 0; $i -lt 90; $i++) { Start-Sleep 1; try { Invoke-RestMethod http://127.0.0.1:9714/state -TimeoutSec 3 | Out-Null; break } catch {} }
          $p = Start-Process dist\Jarvis-Setup-Lite.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$dir", "/LOG=$PWD\update.log" -PassThru -Wait
          Write-Host "update over the running Jarvis: installer exit code $($p.ExitCode); old Jarvis ended: $($app.HasExited)"
          Select-String -Path update.log -Pattern "Closing|close|Restart Manager|in use" | Select-Object -First 10 | ForEach-Object { "  " + $_.Line }
          if (-not $app.HasExited) { $app.Kill(); throw "the installer did not close the running Jarvis" }
          if ($p.ExitCode -ne 0) { throw "the update over the running Jarvis failed" }
          $log = Get-ChildItem "$env:APPDATA", "$env:LOCALAPPDATA" -Recurse -Depth 3 -Filter log.txt -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*jarvis*" } | Sort-Object LastWriteTime | Select-Object -Last 1
          if ($log) {
            Write-Host "=== $($log.FullName)"
            Select-String -Path $log.FullName -Pattern "Window:|UI:|Exit requested|Microphone|instance|show" | Select-Object -Last 30 | ForEach-Object { $_.Line }
          } else { Write-Host "log.txt not found" }

  # The release "build-latest": only from main and only when BOTH the tests and the build passed.
  # dev/* branches stop before this job (the check of a branch is never published).
  publish:
    needs: [test, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # one publication at a time; a newer run waits for the one in progress
    concurrency:
      group: publish-build-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: jarvis-app
          path: build/Jarvis

      # main moved on while this run was building: the newer commit is published by its own run,
      # an older build never replaces a newer one
      - name: Is this still the latest commit of main?
        id: fresh
        shell: bash
        run: |
          git fetch --depth=1 origin main
          if [ "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main is already at $(git rev-parse --short FETCH_HEAD), this build of ${GITHUB_SHA::7} is not published"
          fi

      # the tag points at the commit the files are built from (the "Source code" of the release matches them)
      - name: Move tag build-latest to this commit
        if: steps.fresh.outputs.latest == 'true'
        shell: bash
        run: |
          git tag -f build-latest "$GITHUB_SHA"
          git push -f origin refs/tags/build-latest

      - name: Publish to release "build-latest"
        if: steps.fresh.outputs.latest == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-latest
          name: Latest build (installer)
          body: |
            Automatic Windows build of the latest commit. Jarvis-Setup.exe (with the Piper neural voice) or Jarvis-Setup-Lite.exe (smaller, Windows voices only). jarvis-app.exe alone (about 30 MB) replaces the program in an already installed Jarvis (no need to download the installer again). commands-update.zip (tiny) - unpack into the resources folder of an installed Jarvis to get new commands.

            Commit: ${{ github.sha }} (tests and build passed, run ${{ github.run_id }})
          files: |
            dist/Jarvis-Setup.exe
            dist/Jarvis-Setup-Lite.exe
            build/Jarvis/jarvis-app.exe
            dist/commands-update.zip

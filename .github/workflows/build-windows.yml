name: Build Windows installer

on:
  workflow_dispatch:
  push:
    # main: tests + installers + release "build-latest"; dev/*: the same tests and build as a check, without a release
    branches: [main, "dev/**"]
    paths-ignore:
      - "README.md"

permissions:
  contents: write

jobs:
  # The name of every file package (artifact) of this run carries the date and the time of the run (Tashkent, UTC+5) and the commit,
  # so that the page of the run shows which package is the new one: «Jarvis-17.10.2026_12-09_b928e59».
  stamp:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.s.outputs.label }}
    steps:
      - id: s
        shell: bash
        run: echo "label=$(TZ=Asia/Tashkent date +%d.%m.%Y_%H-%M)_${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  # automated tests of jarvis-core on Windows; the installers are built meanwhile, but a failure stops the publication
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests (jarvis-core)
        shell: pwsh
        run: |
          $env:LIB = "$PWD\lib\windows\amd64;$env:LIB"
          $env:PATH = "$PWD\lib\windows\amd64;$env:PATH"
          cargo test -p jarvis-core --no-fail-fast 2>&1 | Tee-Object -FilePath test.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # the reason goes into an annotation: it is visible on the run page and through the API without signing in
            $found = Select-String -Path test.log -Pattern 'error(\[E\d+\])?:|panicked|FAILED|failures:|test result' -Context 0,4 | Select-Object -First 40
            $text = ($found | ForEach-Object { $_.Line; $_.Context.PostContext }) -join "`n"
            if ($text.Length -gt 30000) { $text = $text.Substring(0, 30000) }
            $text = $text.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            Write-Output "::error title=cargo test::$text"
            exit $code
          }

  build:
    needs: stamp
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build jarvis-app (release)
        shell: pwsh
        run: |
          $env:LIB = "$PWD\lib\windows\amd64;$env:LIB"
          # the commit is written into the program: a report of a problem (diagnostics, the speech message) names the build
          $env:JARVIS_BUILD_SHA = "${{ github.sha }}"
          cargo build --release -p jarvis-app

      # Code signing (only when the owner has put the certificate into the secrets; see installer/sign.ps1 and docs/SIGNING.md)
      - name: Sign jarvis-app.exe
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ./installer/sign.ps1 target\release\jarvis-app.exe

      - name: Assemble program folder
        shell: pwsh
        run: |
          $out = "build\Jarvis"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item target\release\jarvis-app.exe $out
          Copy-Item lib\windows\amd64\*.dll $out
          foreach ($d in "commands", "sound", "keywords", "rustpotter") {
            Copy-Item "resources\$d" "$out\resources\$d" -Recurse
          }
          New-Item -ItemType Directory -Force "$out\resources\vosk" | Out-Null
          Copy-Item resources\vosk\README.md "$out\resources\vosk"
          Get-ChildItem $out -Recurse | Measure-Object -Property Length -Sum

      # Lite installer: Windows built-in voices only
      - name: Build lite installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          New-Item -ItemType Directory -Force dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DSrcDir=build\Jarvis /DOutName=Jarvis-Setup-Lite /DBuildSha=$($env:GITHUB_SHA.Substring(0,7)) /DBuildDate=$(Get-Date -Format 'yyyy-MM-dd') installer\jarvis.iss 2>&1 | Tee-Object -FilePath iscc-lite.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Full installer: adds the Piper neural voice (offline). Change the voice names to switch voices:
      # list and samples: https://rhasspy.github.io/piper-samples/
      - name: Add Piper neural voices
        id: piper
        continue-on-error: true
        shell: pwsh
        env:
          PIPER_RU_VOICE: ru_RU-irina-medium
          PIPER_EN_VOICE: en_US-amy-medium
        run: |
          $ErrorActionPreference = "Stop"
          Copy-Item build\Jarvis build\JarvisFull -Recurse
          $piper = "build\JarvisFull\piper"
          Invoke-WebRequest "https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_windows_amd64.zip" -OutFile piper.zip
          # the archive is unpacked only when it is exactly the release the program pins (the same value as in voice_install.rs),
          # and only when every name stays under piper/
          $pinned = "f3c58906402b24f3a96d92145f58acba6d86c9b5db896d207f78dc80811efcea"
          if ((Get-FileHash piper.zip -Algorithm SHA256).Hash.ToLower() -ne $pinned) { throw "piper.zip does not match the pinned SHA-256" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $pz = [System.IO.Compression.ZipFile]::OpenRead("$PWD\piper.zip")
          foreach ($e in $pz.Entries) {
            $n = $e.FullName.Replace("\", "/")
            if ($n.StartsWith("/") -or $n.Contains("..") -or $n.Contains(":") -or -not $n.StartsWith("piper/")) { $pz.Dispose(); throw "piper.zip: unsafe name $n" }
          }
          $pz.Dispose()
          Expand-Archive piper.zip -DestinationPath build\JarvisFull
          New-Item -ItemType Directory -Force "$piper\voices" | Out-Null
          foreach ($pair in @(@("ru", $env:PIPER_RU_VOICE), @("en", $env:PIPER_EN_VOICE))) {
            $lang = $pair[0]; $name = $pair[1]
            # ru_RU-irina-medium -> ru/ru_RU/irina/medium/ru_RU-irina-medium
            $parts = $name -split "-"
            $base = "https://huggingface.co/rhasspy/piper-voices/resolve/main/$($parts[0].Split('_')[0])/$($parts[0])/$($parts[1])/$($parts[2])/$name"
            Invoke-WebRequest "$base.onnx" -OutFile "$piper\voices\$lang.onnx"
            Invoke-WebRequest "$base.onnx.json" -OutFile "$piper\voices\$lang.onnx.json"
            # NOT a verification: the voices come from a branch that changes and no trusted hash is pinned for them yet.
            # The values are printed so that they can be compared with the voices repository page and then pinned
            # (VOICE_PINS in voice_install.rs, docs/SECURITY-DOWNLOADS.md).
            foreach ($f in @("$piper\voices\$lang.onnx", "$piper\voices\$lang.onnx.json")) {
              Write-Host ("VOICE PIN CANDIDATE (unverified): " + (Split-Path $f -Leaf) + " " + (Get-FileHash $f -Algorithm SHA256).Hash.ToLower())
            }
            # model card with the voice license: keep it next to the voice and show it in the log
            try {
              $card = "https://huggingface.co/rhasspy/piper-voices/raw/main/$($parts[0].Split('_')[0])/$($parts[0])/$($parts[1])/MODEL_CARD"
              Invoke-WebRequest $card -OutFile "$piper\voices\$lang.MODEL_CARD.txt"
              Write-Host "=== MODEL CARD $name ==="
              Get-Content "$piper\voices\$lang.MODEL_CARD.txt"
            } catch { Write-Host "no model card for $name" }
          }
          Get-ChildItem $piper -Recurse | Measure-Object -Property Length -Sum

      # Speech recognition model (Vosk, Russian) taken from the release v0.1 archive (jarvis-master.zip)
      # so nobody has to copy model folders by hand. Change VOSK_MODELS to add English / Ukrainian.
      - name: Add Vosk speech model
        id: vosk
        if: steps.piper.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        env:
          VOSK_MODELS: vosk-model-small-ru-0.22
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          Invoke-WebRequest "https://github.com/${{ github.repository }}/releases/download/v0.1/jarvis-master.zip" -OutFile models.zip
          Write-Host ("VOSK ARCHIVE SHA-256 (unverified, from the own release v0.1): " + (Get-FileHash models.zip -Algorithm SHA256).Hash.ToLower())
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("$PWD\models.zip")
          $dstRoot = "$PWD\build\JarvisFull\resources\vosk"
          New-Item -ItemType Directory -Force $dstRoot | Out-Null
          $count = 0
          foreach ($model in $env:VOSK_MODELS.Split(",")) {
            $prefix = "jarvis-master/resources/vosk/$($model.Trim())/"
            foreach ($entry in $zip.Entries) {
              if ($entry.FullName.StartsWith($prefix) -and $entry.Name -ne "") {
                $target = Join-Path $dstRoot $entry.FullName.Substring("jarvis-master/resources/vosk/".Length)
                # a name with .. must not leave the folder of the models
                if (-not [System.IO.Path]::GetFullPath($target).StartsWith([System.IO.Path]::GetFullPath($dstRoot) + "\")) { throw "unsafe name in the archive: $($entry.FullName)" }
                New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
                [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $target, $true)
                $count++
              }
            }
          }
          $zip.Dispose()
          Remove-Item models.zip
          Write-Host "Vosk files extracted: $count"
          if ($count -eq 0) { throw "model not found in the archive" }
          Get-ChildItem $dstRoot | Format-Table Name

      - name: Build full installer
        if: steps.piper.outcome == 'success'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DSrcDir=build\JarvisFull /DOutName=Jarvis-Setup /DBuildSha=$($env:GITHUB_SHA.Substring(0,7)) /DBuildDate=$(Get-Date -Format 'yyyy-MM-dd') installer\jarvis.iss 2>&1 | Tee-Object -FilePath iscc-full.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Without Piper the lite installer is the only one
        if: steps.piper.outcome != 'success'
        shell: pwsh
        run: Copy-Item dist\Jarvis-Setup-Lite.exe dist\Jarvis-Setup.exe

      - name: Sign the installers
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ./installer/sign.ps1 (Get-ChildItem dist\*.exe | ForEach-Object { $_.FullName })

      # tiny update for already installed copies: new / changed commands only
      - name: Pack commands update
        shell: pwsh
        run: Compress-Archive -Path resources\commands -DestinationPath dist\commands-update.zip -Force

      # the archive is unpacked by hand into the resources folder of an installed Jarvis: every name stays under commands/,
      # nothing leads out with .., a drive, a stream or a backslash, no duplicates, and each file is the file of this commit
      - name: Check the commands update archive
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipPath = (Resolve-Path dist\commands-update.zip).Path
          $zip = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          $bad = New-Object System.Collections.Generic.List[string]
          $seen = @{}
          $files = 0
          try {
            foreach ($e in $zip.Entries) {
              $n = $e.FullName
              if ($n.Contains('\')) { $bad.Add("backslash in the name: $n") }
              $p = $n.Replace('\', '/')
              if ($p -notmatch '^commands/') { $bad.Add("outside commands/: $n") }
              if ($p -match '(^|/)\.\.?(/|$)') { $bad.Add("dot part: $n") }
              if ($p.StartsWith('/') -or $p -match '^[A-Za-z]:') { $bad.Add("absolute: $n") }
              if ($p.Contains(':')) { $bad.Add("stream or drive: $n") }
              if ($p -match '//') { $bad.Add("empty part: $n") }
              if ($p -match '(^|/)(con|prn|aux|nul|com[1-9]|lpt[1-9])(\.|/|$)') { $bad.Add("device name: $n") }
              if ($seen.ContainsKey($p.ToLower())) { $bad.Add("duplicate: $n") }
              $seen[$p.ToLower()] = $true
              if ($p.EndsWith('/')) { continue }
              $files++
              $src = Join-Path (Get-Location) ('resources\' + $p)
              if (-not (Test-Path $src)) { $bad.Add("not a file of this commit: $n"); continue }
              $stream = $e.Open()
              try {
                $sha = [System.Security.Cryptography.SHA256]::Create()
                $inZip = [BitConverter]::ToString($sha.ComputeHash($stream)).Replace('-', '')
              } finally { $stream.Dispose() }
              $onDisk = (Get-FileHash $src -Algorithm SHA256).Hash
              if ($inZip -ne $onDisk) { $bad.Add("content differs from the commit: $n") }
            }
          } finally { $zip.Dispose() }
          $expected = @(Get-ChildItem resources\commands -Recurse -File).Count
          if ($files -ne $expected) { $bad.Add("the archive has $files files, the commit has $expected") }
          if ($bad.Count -gt 0) { $bad | ForEach-Object { Write-Host "BAD: $_" }; throw "commands-update.zip is not safe to unpack" }
          Write-Host "commands-update.zip: $files files, all under commands/, all equal to the commit"
          "COMMANDS ARCHIVE: PASS ($files files)" | Add-Content evidence.txt

      - name: List dist
        shell: pwsh
        run: Get-ChildItem dist | Format-Table Name, Length

      - name: Upload dist folder
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-${{ needs.stamp.outputs.label }}
          path: dist/

      # the program alone, for the release (the publish job runs on another machine)
      - name: Upload jarvis-app.exe
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-app-${{ needs.stamp.outputs.label }}
          path: build/Jarvis/jarvis-app.exe

      # the checks run after the upload: the installers stay downloadable even when a check fails
      # both installers are compiled with the Russian and the English language files (the language dialog)
      - name: Check installer languages
        shell: pwsh
        run: |
          $logs = @(Get-ChildItem iscc-*.log)
          if ($logs.Count -eq 0) { Write-Output "::error title=installer::no ISCC output to check"; exit 1 }
          foreach ($log in $logs) {
            $text = Get-Content $log -Raw
            # the [Languages] entries as ISCC reads them ("Reading file: ...\Default.isl" is the English entry; the line
            # "Reading default messages from Default.isl" is printed always and does not count)
            foreach ($isl in "Reading file:.*\\Languages\\Russian\.isl", "Reading file:.*\\Default\.isl") {
              if ($text -notmatch $isl) { Write-Output "::error title=installer::$($log.Name): $isl is not compiled in"; exit 1 }
            }
            if ($text -notmatch "Successful compile") { Write-Output "::error title=installer::$($log.Name): no successful compile"; exit 1 }
            Write-Host "$($log.Name): Russian.isl and Default.isl compiled in"
            Select-String -Path $log -Pattern "\[Languages\]|\.isl" | Select-Object -First 8 | ForEach-Object { "  " + $_.Line }
          }

      # The full installer into a folder with spaces and Cyrillic letters (in English): the program, the Piper voice and
      # the speech model are really installed; then the uninstaller removes the program folder.
      # (innoextract 1.9 does not read the Inno Setup 6.7 format, so the contents are checked by installing.)
      - name: Full installer - install into a Cyrillic path and uninstall
        if: steps.piper.outcome == 'success'
        timeout-minutes: 10
        shell: pwsh
        run: |
          # the window server answers only with its secret (the file ui_token of the data folder): every call of the checks
          # below to 127.0.0.1:9714 carries it, the tests of the refusal say so explicitly
          function JT { $f = Join-Path $env:APPDATA 'com.priler.jarvis\ui_token'; if (Test-Path $f) { (Get-Content $f -Raw).Trim() } else { '' } }
          function Invoke-RestMethod {
            [CmdletBinding()] param([Parameter(Position=0)][string]$Uri, [string]$Method, $Headers, $Body, [string]$ContentType, [int]$TimeoutSec)
            $p = @{ Uri = $Uri }
            foreach ($k in 'Method', 'Body', 'ContentType', 'TimeoutSec') { if ($PSBoundParameters.ContainsKey($k)) { $p[$k] = $PSBoundParameters[$k] } }
            $hdr = @{}
            if ($Headers) { foreach ($k in $Headers.Keys) { $hdr[$k] = $Headers[$k] } }
            if ($Uri -like 'http://127.0.0.1:9714*' -and -not $hdr.ContainsKey('X-Jarvis-Token')) { $t = JT; if ($t) { $hdr['X-Jarvis-Token'] = $t } }
            if ($hdr.Count) { $p['Headers'] = $hdr }
            Microsoft.PowerShell.Utility\Invoke-RestMethod @p
          }
          $ErrorActionPreference = "Stop"
          $dir = "C:\Jarvis Тест Full"
          $p = Start-Process dist\Jarvis-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LANG=english", "/DIR=`"$dir`"", "/LOG=$PWD\install-full.log" -PassThru -Wait
          Write-Host "installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Get-Content install-full.log -Tail 30; throw "silent install failed" }
          $need = @("jarvis-app.exe", "piper\piper.exe", "piper\voices\ru.onnx", "piper\voices\en.onnx", "resources\commands", "resources\vosk\vosk-model-small-ru-0.22", "unins000.exe")
          if ("${{ steps.vosk.outcome }}" -ne "success") { $need = $need | Where-Object { $_ -notlike "*vosk-model*" }; Write-Host "::warning::the full installer was built without the Vosk model" }
          foreach ($f in $need) {
            if (-not (Test-Path -LiteralPath (Join-Path $dir $f))) { throw "not installed: $f" }
            Write-Host "installed: $f"
          }
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Jarvis" -Filter *.lnk | ForEach-Object { $_.Name }
          Write-Host "Start menu: $($lnk -join ', ')"
          if (@($lnk).Count -lt 2) { throw "the Start menu shortcuts are missing" }
          # where every shortcut leads and which icon it has (the target must exist, in the folder with the Cyrillic name).
          # (WScript.Shell gives the target in the ANSI code page: Cyrillic letters become «?», so the Unicode shell link is read)
          $shellApp = New-Object -ComObject Shell.Application
          $lnkDir = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Jarvis"
          foreach ($l in Get-ChildItem $lnkDir -Filter *.lnk) {
            $link = $shellApp.NameSpace($lnkDir).ParseName($l.Name).GetLink
            $icon = ""; try { $ix = 0; $icon = "$($link.GetIconLocation([ref]$ix)),$ix" } catch {}
            $line = "SHORTCUT $($l.Name) -> $($link.Path) $($link.Arguments) | icon: $icon"
            Write-Host $line
            Add-Content evidence.txt $line
            if (-not (Test-Path -LiteralPath $link.Path)) { throw "the shortcut $($l.Name) leads nowhere: $($link.Path)" }
          }
          # uninstall while Jarvis runs in the tray and autostart was switched on from its settings
          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          Set-ItemProperty -Path $runKey -Name "Jarvis" -Value "`"$dir\jarvis-app.exe`" --background"
          $app = Start-Process (Join-Path $dir "jarvis-app.exe") -ArgumentList "--background" -WorkingDirectory $dir -PassThru
          for ($i = 0; $i -lt 60; $i++) { Start-Sleep 1; try { Invoke-RestMethod http://127.0.0.1:9714/state -TimeoutSec 3 | Out-Null; break } catch {} }
          # the voice of Jarvis (Piper) in an install path with spaces and Cyrillic: the diagnostics make a real phrase
          # with the installed piper.exe and voice (nothing is played), then Jarvis tries to play one
          $hh = @{ "X-Jarvis" = "1" }
          Invoke-RestMethod http://127.0.0.1:9714/action -Method Post -Headers $hh -Body '{"name":"diag_run"}' | Out-Null
          $piper = $null
          for ($i = 0; $i -lt 90 -and -not $piper; $i++) {
            Start-Sleep 1
            $dj = Invoke-RestMethod http://127.0.0.1:9714/diag -TimeoutSec 5
            if (-not $dj.running -and $dj.checks) { $piper = $dj.checks | Where-Object { $_.key -eq "piper" } }
          }
          if (-not $piper) { throw "the diagnostics did not finish" }
          Write-Host "PIPER synthesis in '$dir': [$($piper.status)] $($piper.detail)"
          if ($piper.detail -notlike "*синтезирована*") {
            # what exactly is wrong: the installed piper.exe run by hand, in the install folder and in a plain ASCII copy
            Write-Host "=== piper by hand in the install folder"
            $w1 = Join-Path $env:TEMP "direct1.wav"
            "Проверка голоса." | & "$dir\piper\piper.exe" --model "$dir\piper\voices\ru.onnx" --output_file $w1 2>&1 | Select-Object -First 20 | ForEach-Object { "  $_" }
            Write-Host "exit code $LASTEXITCODE; wav exists: $(Test-Path $w1)"
            Write-Host "=== piper by hand in an ASCII copy"
            Copy-Item "$dir\piper" "C:\piper-ascii" -Recurse
            $w2 = Join-Path $env:TEMP "direct2.wav"
            "Проверка голоса." | & "C:\piper-ascii\piper.exe" --model "C:\piper-ascii\voices\ru.onnx" --output_file $w2 2>&1 | Select-Object -First 20 | ForEach-Object { "  $_" }
            Write-Host "exit code $LASTEXITCODE; wav exists: $(Test-Path $w2)"
            Get-ChildItem "$dir\piper" | Select-Object -First 30 | ForEach-Object { "  $($_.Name) $($_.Length)" }
          }
          if ($piper.detail -notlike "*синтезирована*") { throw "Piper could not make a phrase from the installed voice: $($piper.detail)" }
          Invoke-RestMethod http://127.0.0.1:9714/action -Method Post -Headers $hh -Body '{"name":"tts_test"}' | Out-Null
          Start-Sleep 10
          Invoke-RestMethod http://127.0.0.1:9714/action -Method Post -Headers $hh -Body '{"name":"diag_run"}' | Out-Null
          Start-Sleep 15
          $dj = Invoke-RestMethod http://127.0.0.1:9714/diag -TimeoutSec 5
          $piper = $dj.checks | Where-Object { $_.key -eq "piper" }
          Write-Host "PIPER playback on this runner (it has no sound card, so a failure here is expected): [$($piper.status)] $($piper.detail)"
          Add-Content evidence.txt "PIPER synthesis in the install folder with Cyrillic: made a phrase (the diagnostics card said so before playback)"
          Add-Content evidence.txt "PIPER playback on this runner (no sound card): [$($piper.status)] $($piper.detail)"
          # the voice stays running: the phrases of the test above went through ONE piper.exe (the real one), not one per phrase
          $warm = $dj.warm_piper
          Write-Host "PIPER WARM: $($warm | ConvertTo-Json -Compress)"
          Add-Content evidence.txt "PIPER WARM (the voice stays running): mode=$($warm.mode) piper.exe started $($warm.spawns) time(s), phrases made $($warm.served), phrases made the usual way after a failure $($warm.fallbacks), first phrase $($warm.first_ms) ms, last $($warm.last_ms) ms, last error '$($warm.last_error)'"
          if ($warm.mode -ne "persistent" -or $warm.served -lt 1 -or $warm.fallbacks -gt 0) { Write-Output "::warning title=piper warm::the voice did not stay running: $($warm | ConvertTo-Json -Compress)" }
          # a second phrase through the same piper.exe: it must not load the model again (the first phrase includes the loading)
          Invoke-RestMethod http://127.0.0.1:9714/action -Method Post -Headers $hh -Body '{"name":"tts_test"}' | Out-Null
          Start-Sleep 8
          $warm2 = (Invoke-RestMethod http://127.0.0.1:9714/diag -TimeoutSec 5).warm_piper
          Write-Host "PIPER WARM after the second phrase: $($warm2 | ConvertTo-Json -Compress)"
          Add-Content evidence.txt "PIPER WARM, second phrase through the same piper.exe: phrases made $($warm2.served), piper.exe started $($warm2.spawns) time(s), usual way after a failure $($warm2.fallbacks), first phrase $($warm2.first_ms) ms (with loading the model), last phrase $($warm2.last_ms) ms"
          if ($warm2.spawns -ne 1 -or $warm2.served -lt 2 -or $warm2.fallbacks -gt 0) { Write-Output "::warning title=piper warm second phrase::$($warm2 | ConvertTo-Json -Compress)" }
          # the Windows voice (PowerShell + System.Speech) started by a Jarvis that was started like the autostart does
          # (--background: no console, so no valid standard handles). The error «os error 50» must not come back.
          Invoke-RestMethod http://127.0.0.1:9714/settings -Method Post -Headers $hh -ContentType "application/json" -Body '{"voice_name":"win:"}' | Out-Null
          Invoke-RestMethod http://127.0.0.1:9714/action -Method Post -Headers $hh -Body '{"name":"tts_test"}' | Out-Null
          Start-Sleep 12
          $sj = Invoke-RestMethod http://127.0.0.1:9714/state -TimeoutSec 5
          $prob = "$($sj.speech.problem)"
          Write-Host "WINDOWS VOICE after a --background start: windows_voice=$($sj.speech.windows_voice); problem='$prob'"
          Add-Content evidence.txt "WINDOWS VOICE (PowerShell spawn from a --background Jarvis): problem='$prob'"
          if ($prob -like "*os error*" -or $prob -like "*Не удалось запустить озвучку*") { Write-Output "::error title=windows voice::$prob"; throw "the Windows voice could not be started: $prob" }
          Invoke-RestMethod http://127.0.0.1:9714/settings -Method Post -Headers $hh -ContentType "application/json" -Body '{"voice_name":""}' | Out-Null
          # the voice of the Telegram bot with the REAL engines: Piper -> voice message (Opus) -> Vosk, in the Cyrillic folder
          $st = Join-Path $PWD "selftest-speech.txt"
          # a CONTROL: a Russian phrase by a known-good voice that has nothing to do with Piper (Microsoft's online voice,
          # no key needed), cut to 16 kHz mono. Vosk must understand it; if it does not, the fault is in the recognizer.
          $ctl = Join-Path $PWD "control-ru.wav"
          try {
            python -m pip install --quiet edge-tts imageio-ffmpeg 2>&1 | Out-Null
            python -m edge_tts --voice ru-RU-SvetlanaNeural --text "Привет, Джарвис, включи музыку" --write-media control-ru.mp3 2>&1 | Select-Object -First 3 | ForEach-Object { Write-Host "  edge-tts: $_" }
            if ((Get-Item control-ru.mp3 -ErrorAction SilentlyContinue).Length -lt 5000) { throw "the online voice gave no recording" }
            $ff = (python -c "import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())").Trim()
            & $ff -y -loglevel error -i control-ru.mp3 -ar 16000 -ac 1 -c:a pcm_s16le $ctl
            Write-Host "control recording: $((Get-Item $ctl).Length) bytes"
          } catch { Write-Host "the control recording could not be made: $($_.Exception.Message)" }
          # (the last failed native command above must not become the exit code of this whole step)
          $global:LASTEXITCODE = 0
          $spArgs = @("--selftest-speech", "`"$st`"")
          if (Test-Path $ctl) { $spArgs += @("--control", "`"$ctl`"") }
          $sp = Start-Process "$dir\jarvis-app.exe" -ArgumentList $spArgs -WorkingDirectory $dir -PassThru -Wait -WindowStyle Hidden
          $rep = if (Test-Path $st) { (Get-Content $st -Raw -Encoding UTF8).Trim() } else { "no report (exit code $($sp.ExitCode))" }
          Write-Host "SPEECH E2E: $rep"
          Add-Content evidence.txt "SPEECH E2E (Piper -> Opus voice message -> Vosk): $rep"
          # a hard check: the Russian voice must be the one that speaks, and Vosk must understand the phrase of Jarvis's own voice
          # (through the Opus voice message and without it)
          if ($rep -notlike "OK voice ru.onnx*" -or $rep -notlike "*heard: *джарвис*музык**without the codec: *джарвис*музык*") { Write-Output "::error title=speech e2e::$rep"; throw "the speech chain Piper -> Opus -> Vosk failed: $rep" }
          # the secrets of the user (the Telegram token, the phone link) must go with the program; the rest stays
          $data = Join-Path $env:APPDATA "com.priler.jarvis"
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          Set-Content -LiteralPath (Join-Path $data "telegram.json") -Value '{"token":"dpapi:00"}'
          Set-Content -LiteralPath (Join-Path $data "remote_token") -Value "0123456789abcdef0123456789abcdef"
          Set-Content -LiteralPath (Join-Path $data "ci-keep.txt") -Value "kept"
          $u = Start-Process (Join-Path $dir "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru -Wait
          Write-Host "uninstaller exit code: $($u.ExitCode)"
          # the uninstaller finishes in a copy of itself: a few seconds
          for ($i = 0; $i -lt 30 -and (Test-Path -LiteralPath (Join-Path $dir "jarvis-app.exe")); $i++) { Start-Sleep 1 }
          if (Test-Path -LiteralPath (Join-Path $dir "jarvis-app.exe")) { throw "the uninstaller left jarvis-app.exe" }
          Write-Host "uninstalled: the program is removed"
          if (-not $app.WaitForExit(10000)) { $app.Kill(); throw "the uninstaller left Jarvis running" }
          if ((Get-ItemProperty -Path $runKey -ErrorAction SilentlyContinue).PSObject.Properties.Name -contains "Jarvis") { throw "the autostart entry stayed after uninstall" }
          Write-Host "uninstalled: Jarvis was ended and the autostart entry removed"
          foreach ($f in "telegram.json", "remote_token") { if (Test-Path -LiteralPath (Join-Path $data $f)) { throw "the uninstaller left the secret $f" } }
          if (-not (Test-Path -LiteralPath (Join-Path $data "ci-keep.txt"))) { throw "a silent uninstall deleted the user's data without asking" }
          Write-Host "uninstalled: the secrets are removed, the other data of the user is kept (silent uninstall)"

      # The Lite installer is installed silently and the installed Jarvis is started on the CI machine: its page server
      # answers, a second start does not leave a second process, the window is asked to show, and the full exit ends the
      # process. (The CI machine has no microphone and no user at the screen: the voice is not checked here.)
      - name: Smoke test of the installed Jarvis
        timeout-minutes: 10
        shell: pwsh
        run: |
          # the window server answers only with its secret (the file ui_token of the data folder): every call of the checks
          # below to 127.0.0.1:9714 carries it, the tests of the refusal say so explicitly
          function JT { $f = Join-Path $env:APPDATA 'com.priler.jarvis\ui_token'; if (Test-Path $f) { (Get-Content $f -Raw).Trim() } else { '' } }
          function Invoke-RestMethod {
            [CmdletBinding()] param([Parameter(Position=0)][string]$Uri, [string]$Method, $Headers, $Body, [string]$ContentType, [int]$TimeoutSec)
            $p = @{ Uri = $Uri }
            foreach ($k in 'Method', 'Body', 'ContentType', 'TimeoutSec') { if ($PSBoundParameters.ContainsKey($k)) { $p[$k] = $PSBoundParameters[$k] } }
            $hdr = @{}
            if ($Headers) { foreach ($k in $Headers.Keys) { $hdr[$k] = $Headers[$k] } }
            if ($Uri -like 'http://127.0.0.1:9714*' -and -not $hdr.ContainsKey('X-Jarvis-Token')) { $t = JT; if ($t) { $hdr['X-Jarvis-Token'] = $t } }
            if ($hdr.Count) { $p['Headers'] = $hdr }
            Microsoft.PowerShell.Utility\Invoke-RestMethod @p
          }
          $ErrorActionPreference = "Stop"
          $dir = "C:\JarvisSmoke"
          $p = Start-Process dist\Jarvis-Setup-Lite.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LANG=russian", "/DIR=$dir", "/LOG=$PWD\install.log" -PassThru -Wait
          Write-Host "installer exit code: $($p.ExitCode)"
          Get-Content install.log -TotalCount 12
          # what the installer did with the rights of the program folder (the check of the result is below)
          Select-String -Path install.log -Pattern "Access rights of the program folder|Setup step|Exception|Runtime error|icacls" | ForEach-Object { Write-Host ("[install.log] " + $_.Line) }
          Write-Host "[install.log] last lines:"; Get-Content install.log -Tail 6 | ForEach-Object { Write-Host ("[install.log]   " + $_) }
          if ($p.ExitCode -ne 0) { throw "silent install failed" }
          foreach ($f in "jarvis-app.exe", "resources\commands", "unins000.exe") {
            if (-not (Test-Path "$dir\$f")) { throw "not installed: $f" }
          }
          # The Windows voice (PowerShell + System.Speech) when Jarvis is started the ways a user starts it: like the
          # autostart (--background, no console), through cmd start, through the shell (Explorer, like a shortcut).
          # «os error 50» when PowerShell is started must not appear in any of them. (This runner has no sound card:
          # whether the sound is HEARD is NOT TESTED here; only that PowerShell starts and the engine reports honestly.)
          foreach ($mode in "background", "cmdstart", "explorer") {
            $exe = "$dir\jarvis-app.exe"
            switch ($mode) {
              "background" { $null = Start-Process $exe -ArgumentList "--background" -WorkingDirectory $dir }
              "cmdstart" { $null = Start-Process cmd -ArgumentList "/c", "start", '""', "`"$exe`"" -WindowStyle Hidden -WorkingDirectory $dir }
              "explorer" { $null = Start-Process explorer.exe -ArgumentList "`"$exe`"" }
            }
            $upm = $false
            for ($i = 0; $i -lt 90 -and -not $upm; $i++) { Start-Sleep 1; try { Invoke-RestMethod http://127.0.0.1:9714/state -TimeoutSec 3 | Out-Null; $upm = $true } catch {} }
            if (-not $upm) { Write-Host "WINDOWS VOICE [$mode]: Jarvis did not start this way"; Add-Content evidence.txt "WINDOWS VOICE [$mode]: Jarvis did not start this way (not tested)"; continue }
            $hm = @{ "X-Jarvis" = "1" }
            Invoke-RestMethod http://127.0.0.1:9714/settings -Method Post -Headers $hm -ContentType "application/json" -Body '{"voice_name":"win:"}' | Out-Null
            Invoke-RestMethod http://127.0.0.1:9714/action -Method Post -Headers $hm -Body '{"name":"tts_test"}' | Out-Null
            Start-Sleep 12
            $sm = Invoke-RestMethod http://127.0.0.1:9714/state -TimeoutSec 5
            $pm = "$($sm.speech.problem)"
            $dj2 = Invoke-RestMethod http://127.0.0.1:9714/diag -TimeoutSec 5
            Write-Host "WINDOWS VOICE [$mode]: problem='$pm'"
            Add-Content evidence.txt "WINDOWS VOICE [$mode] (PowerShell start): problem='$pm'"
            Invoke-RestMethod http://127.0.0.1:9714/settings -Method Post -Headers $hm -ContentType "application/json" -Body '{"voice_name":""}' | Out-Null
            Invoke-RestMethod http://127.0.0.1:9714/action -Method Post -Headers $hm -Body '{"name":"app_exit"}' | Out-Null
            for ($i = 0; $i -lt 30 -and @(Get-Process jarvis-app -ErrorAction SilentlyContinue).Count -gt 0; $i++) { Start-Sleep 1 }
            if ($pm -like "*os error 50*" -or $pm -like "*Не удалось запустить озвучку*") { throw "the Windows voice could not start PowerShell when Jarvis was started by '$mode': $pm" }
          }
          # The own window with multithreaded COM on the main thread. On a computer with a microphone the microphone library
          # leaves the main thread multithreaded COM, and Tao (OleInitialize) used to panic: RPC_E_CHANGED_MODE, exit code 101.
          # This runner has no microphone, so the same state is made on purpose (a test seam of the program, off by default).
          $env:JARVIS_TEST_MTA_MAIN = "1"
          $env:JARVIS_WEBVIEW_DEBUG_PORT = "9334"
          $mta = Start-Process "$dir\jarvis-app.exe" -WorkingDirectory $dir -PassThru
          Remove-Item Env:JARVIS_TEST_MTA_MAIN
          Remove-Item Env:JARVIS_WEBVIEW_DEBUG_PORT
          $mtaOpen = $false
          for ($i = 0; $i -lt 90 -and -not $mtaOpen; $i++) {
            Start-Sleep 1
            if ($mta.HasExited) { break }
            try { Invoke-RestMethod http://127.0.0.1:9334/json/version -TimeoutSec 2 | Out-Null; $mtaOpen = $true } catch {}
          }
          if ($mtaOpen) { Start-Sleep 5 }
          $mtaAlive = -not $mta.HasExited
          $mtaRes = if ($mtaOpen -and $mtaAlive) { "PASS" } elseif ($mta.HasExited) { "FAIL (jarvis-app ended, exit code $($mta.ExitCode))" } else { "FAIL (the window did not open)" }
          Write-Host "WINDOW WITH MULTITHREADED COM ON THE MAIN THREAD: $mtaRes"
          Add-Content evidence.txt "WINDOW WITH MULTITHREADED COM ON THE MAIN THREAD: $mtaRes"
          $mtaLog = Get-ChildItem -Path "$env:APPDATA\com.priler.jarvis", "$env:LOCALAPPDATA\com.priler.jarvis" -Recurse -Filter "log.txt" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($mtaLog) { Get-Content -LiteralPath $mtaLog.FullName -Tail 400 | Select-String "COM of the main thread|COM of the window|OleInitialize|panicked" | ForEach-Object { Write-Host "   $($_.Line)"; Add-Content evidence.txt "   $($_.Line)" } }
          if ($mtaAlive) {
            try { Invoke-RestMethod http://127.0.0.1:9714/action -Method Post -Headers @{ "X-Jarvis" = "1" } -Body '{"name":"app_exit"}' | Out-Null } catch {}
            for ($i = 0; $i -lt 30 -and @(Get-Process jarvis-app -ErrorAction SilentlyContinue).Count -gt 0; $i++) { Start-Sleep 1 }
            Get-Process jarvis-app -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          if ($mtaRes -ne "PASS") { throw "the window did not open when the main thread is multithreaded COM: $mtaRes" }
          # the debugging port of the WebView2 window for this one run (the interface is checked in the real window below)
          $env:JARVIS_WEBVIEW_DEBUG_PORT = "9333"
          $app = Start-Process "$dir\jarvis-app.exe" -WorkingDirectory $dir -PassThru
          Remove-Item Env:JARVIS_WEBVIEW_DEBUG_PORT
          $up = $false
          for ($i = 0; $i -lt 90 -and -not $up; $i++) {
            Start-Sleep 1
            try { $state = Invoke-RestMethod http://127.0.0.1:9714/state -TimeoutSec 3; $up = $true } catch {}
            if ($app.HasExited) { throw "jarvis-app ended at start, exit code $($app.ExitCode)" }
          }
          if (-not $up) { throw "the page server did not answer in 90 s" }
          Write-Host "page server answers; voice: $($state.voice_state.state) - $($state.voice_state.detail)"
          $h = @{ "X-Jarvis" = "1" }
          # a second start: shows the running window and ends, no second Jarvis stays
          $second = Start-Process "$dir\jarvis-app.exe" -WorkingDirectory $dir -PassThru
          if (-not $second.WaitForExit(40000)) { $second.Kill(); throw "the second start did not end" }
          $count = @(Get-Process jarvis-app -ErrorAction SilentlyContinue).Count
          Write-Host "second start ended (exit code $($second.ExitCode)); jarvis-app processes: $count"
          if ($count -ne 1) { throw "expected one jarvis-app process, found $count" }
          $r = Invoke-RestMethod http://127.0.0.1:9714/action -Method Post -Headers $h -Body '{"name":"show_window"}'
          Write-Host "show_window: $($r | ConvertTo-Json -Compress)"
          # the REAL WebView2 window: the pages, the mouse drag in the builder, Esc, the archive of dialogs
          $wv = "FAIL"; $wvWhy = ""
          try {
            npm install --prefix "$env:RUNNER_TEMP\pw" playwright-core@1.49.1 --silent 2>&1 | Out-Null
            $cdp = $false
            for ($i = 0; $i -lt 90 -and -not $cdp; $i++) { try { Invoke-RestMethod http://127.0.0.1:9333/json/version -TimeoutSec 2 | Out-Null; $cdp = $true } catch { Start-Sleep 1 } }
            if (-not $cdp) { throw "the debugging port of the WebView2 window did not open" }
            $env:NODE_PATH = "$env:RUNNER_TEMP\pw\node_modules"
            node .github\scripts\webview2-e2e.js 9333 webview2-e2e.txt
            if ($LASTEXITCODE -ne 0) { throw "some checks failed (the lines above say which)" }
            $wv = "PASS"
          } catch { $wvWhy = $_.Exception.Message }
          Write-Host "WEBVIEW2 E2E: $wv $wvWhy"
          Add-Content evidence.txt "WEBVIEW2 E2E (the real window): $wv $wvWhy"
          if (Test-Path webview2-e2e.txt) { Get-Content webview2-e2e.txt | ForEach-Object { Add-Content evidence.txt "   $_" } }
          if ($wv -ne "PASS") { Write-Output "::warning title=webview2 e2e::$wvWhy" }
          # "Свернуть в трей" (the same way as the tray menu): Jarvis keeps running
          $r = Invoke-RestMethod http://127.0.0.1:9714/action -Method Post -Headers $h -Body '{"name":"hide_window"}'
          Write-Host "hide_window: $($r | ConvertTo-Json -Compress)"
          Start-Sleep 2
          if ($app.HasExited) { throw "Jarvis ended after the window requests" }
          # the pages added later, on the installed Jarvis: tasks (a real file in Documents), messages, Telegram
          $t = Invoke-RestMethod http://127.0.0.1:9714/tasks -TimeoutSec 5
          $before = @($t.tasks).Count
          $mark = "ci-проверка $(Get-Random)"
          $r = Invoke-RestMethod http://127.0.0.1:9714/tasks -Method Post -Headers $h -Body ([Text.Encoding]::UTF8.GetBytes((@{ op = "add"; text = $mark } | ConvertTo-Json -Compress))) -ContentType "application/json; charset=utf-8"
          if (-not $r.ok) { throw "tasks add failed: $($r.message)" }
          $t = Invoke-RestMethod http://127.0.0.1:9714/tasks -TimeoutSec 5
          if (@($t.tasks) -notcontains $mark) { throw "the added task is not in the list" }
          $file = Get-Content -LiteralPath $t.path -Encoding UTF8 -Raw
          if ($file -notlike "*$mark*") { throw "the task is not in the file $($t.path)" }
          $i = [array]::IndexOf(@($t.tasks), $mark)
          $r = Invoke-RestMethod http://127.0.0.1:9714/tasks -Method Post -Headers $h -Body ([Text.Encoding]::UTF8.GetBytes((@{ op = "remove"; index = $i; old = $mark } | ConvertTo-Json -Compress))) -ContentType "application/json; charset=utf-8"
          if (-not $r.ok -or @((Invoke-RestMethod http://127.0.0.1:9714/tasks).tasks).Count -ne $before) { throw "tasks remove failed" }
          Write-Host "tasks: added and removed in $($t.path)"
          try { Invoke-RestMethod http://127.0.0.1:9714/tasks -Method Post -Body '{"op":"clear"}' | Out-Null; throw "tasks clear without the header was accepted" } catch { if ($_.Exception.Message -like "*without the header*") { throw } }
          $m = Invoke-RestMethod http://127.0.0.1:9714/messages -TimeoutSec 5
          if (@($m.networks).Count -ne 11) { throw "expected 11 networks, got $(@($m.networks).Count)" }
          $tg = Invoke-RestMethod http://127.0.0.1:9714/telegram -TimeoutSec 5
          Write-Host "messages: $(@($m.messages).Count), networks: $(@($m.networks).Count); telegram: enabled=$($tg.enabled) available=$($tg.available)"
          if ($tg.enabled) { throw "the Telegram bot must be off by default" }
          # the window server without its secret: nothing is read, nothing is done (the leak of the link of the phone remote included)
          $uiAuth = "FAIL"; $uiWhy = ""
          try {
            $bare = @('/state', '/remote', '/remote-qr', '/diag-report', '/settings', '/chats', '/tasks', '/telegram', '/commands')
            foreach ($u in $bare) {
              $x = Microsoft.PowerShell.Utility\Invoke-WebRequest "http://127.0.0.1:9714$u" -SkipHttpErrorCheck -TimeoutSec 5
              if ([int]$x.StatusCode -ne 403) { throw "$u answered $([int]$x.StatusCode) without the secret" }
            }
            $x = Microsoft.PowerShell.Utility\Invoke-WebRequest "http://127.0.0.1:9714/action" -Method Post -Headers @{ "X-Jarvis" = "1" } -Body '{"name":"app_exit"}' -SkipHttpErrorCheck -TimeoutSec 5
            if ([int]$x.StatusCode -ne 403) { throw "POST /action answered $([int]$x.StatusCode) with X-Jarvis but without the secret" }
            $x = Microsoft.PowerShell.Utility\Invoke-WebRequest "http://127.0.0.1:9714/state" -Headers @{ "X-Jarvis-Token" = ("0" * 64) } -SkipHttpErrorCheck -TimeoutSec 5
            if ([int]$x.StatusCode -ne 403) { throw "a wrong secret answered $([int]$x.StatusCode)" }
            $x = Microsoft.PowerShell.Utility\Invoke-WebRequest "http://127.0.0.1:9714/state" -Headers @{ "X-Jarvis-Token" = (JT) } -SkipHttpErrorCheck -TimeoutSec 5
            if ([int]$x.StatusCode -ne 200) { throw "the right secret answered $([int]$x.StatusCode)" }
            $x = Microsoft.PowerShell.Utility\Invoke-WebRequest "http://127.0.0.1:9714/" -SkipHttpErrorCheck -TimeoutSec 5
            if ([int]$x.StatusCode -ne 200 -or $x.Content.Contains((JT))) { throw "the page must open and must not contain the secret" }
            $uiAuth = "PASS"
          } catch { $uiWhy = $_.Exception.Message }
          Write-Host "UI AUTH: $uiAuth $uiWhy"
          Add-Content evidence.txt "UI AUTH (the window server needs its secret): $uiAuth $uiWhy"
          if ($uiAuth -ne "PASS") { Write-Output "::warning title=ui auth::$uiWhy" }
          # the data folder (keys, the secrets of the window and of the phone remote, the dialogs) is for its user alone:
          # read back by the system tool, not by Jarvis. Informational: the access list of the program folder as installed.
          $aclOk = "FAIL"; $aclWhy = ""
          try {
            $dd = Join-Path $env:APPDATA 'com.priler.jarvis'
            $txt = (icacls $dd | Out-String)
            foreach ($bad in @("Everyone", "BUILTIN\Users", "Authenticated Users")) { if ($txt.Contains($bad)) { throw "$bad is in the access list of the data folder" } }
            if ($txt.Contains("(I)")) { throw "the data folder inherits access from its parent" }
            foreach ($f in @("ui_token", "remote_token")) {
              $p = Join-Path $dd $f
              if (Test-Path $p) { $t2 = (icacls $p | Out-String); foreach ($bad in @("Everyone", "BUILTIN\Users", "Authenticated Users")) { if ($t2.Contains($bad)) { throw "$bad can read $f" } } }
            }
            if (-not (Test-Path (Join-Path $dd 'ui_token'))) { throw "no ui_token file to check" }
            $aclOk = "PASS"
          } catch { $aclWhy = $_.Exception.Message }
          Write-Host "DATA ACL: $aclOk $aclWhy"
          Add-Content evidence.txt "DATA ACL (the data folder is for its user, SYSTEM and Administrators only): $aclOk $aclWhy"
          if ($aclOk -ne "PASS") { Write-Output "::warning title=data acl::$aclWhy" }
          # The program folder as the installer left it: nobody but SYSTEM, Administrators and the owner may change anything in it
          # (a standard user of the computer must not be able to replace jarvis-app.exe, a library or a command file that the
          # owner then runs). Read with Get-Acl, for the folder and for the files that matter, whatever the folder's name.
          $instOk = "FAIL"; $instWhy = ""
          try {
            $writeRights = [System.Security.AccessControl.FileSystemRights]'WriteData, AppendData, Delete, DeleteSubdirectoriesAndFiles, WriteAttributes, WriteExtendedAttributes, ChangePermissions, TakeOwnership'
            $risky = 'Authenticated Users|BUILTIN\\Users|Everyone|INTERACTIVE'
            foreach ($t in @("C:\JarvisSmoke", "C:\JarvisSmoke\jarvis-app.exe", "C:\JarvisSmoke\resources\commands\_prelude.lua", "C:\JarvisSmoke\piper\piper.exe")) {
              if (-not (Test-Path $t)) { continue }
              $acl = Get-Acl $t
              foreach ($ace in $acl.Access) {
                if ($ace.AccessControlType -eq 'Allow' -and "$($ace.IdentityReference)" -match $risky -and ($ace.FileSystemRights -band $writeRights)) {
                  throw "SECURITY: $($ace.IdentityReference) may change $t ($($ace.FileSystemRights))"
                }
              }
            }
            $instOk = "PASS"
          } catch { $instWhy = $_.Exception.Message }
          Write-Host "INSTALL ACL: $instOk $instWhy"
          Add-Content evidence.txt "INSTALL FOLDER ACL (no write rights for Users / Authenticated Users / Everyone on the folder and its key files): $instOk $instWhy"
          if ($instOk -ne "PASS") { Write-Output "::warning title=install acl::$instWhy" }
          # real commands of the installed Jarvis (the queue shared by the window, the voice, the phone and Telegram):
          # «открой блокнот» starts Notepad, «закрой блокнот» ends it
          $cmdOk = "FAIL"; $cmdWhy = ""
          try {
            function Ask($t) { Invoke-RestMethod http://127.0.0.1:9714/chat -Method Post -Headers $h -ContentType "application/json; charset=utf-8" -Body ([Text.Encoding]::UTF8.GetBytes((@{ op = "ask"; text = $t; rid = [guid]::NewGuid().ToString() } | ConvertTo-Json -Compress))) }
            $n0 = @(Get-Process notepad -ErrorAction SilentlyContinue).Count
            $r = Ask "открой блокнот"
            $started = $false
            for ($i = 0; $i -lt 25 -and -not $started; $i++) { Start-Sleep 1; if (@(Get-Process notepad -ErrorAction SilentlyContinue).Count -gt $n0) { $started = $true } }
            if (-not $started) { throw "«открой блокнот» did not start Notepad (answer: $($r | ConvertTo-Json -Compress))" }
            Write-Host "command «открой блокнот»: Notepad started"
            # closing a program is a high-risk command: Jarvis asks first, and only «да» from the same door runs it
            Ask "закрой блокнот" | Out-Null
            Start-Sleep 4
            if (@(Get-Process notepad -ErrorAction SilentlyContinue).Count -le $n0) { throw "«закрой блокнот» ended Notepad WITHOUT the confirmation" }
            Write-Host "command «закрой блокнот»: Jarvis asked first, Notepad is still open"
            Ask "да" | Out-Null
            $ended = $false
            for ($i = 0; $i -lt 25 -and -not $ended; $i++) { Start-Sleep 1; if (@(Get-Process notepad -ErrorAction SilentlyContinue).Count -le $n0) { $ended = $true } }
            if (-not $ended) { throw "«закрой блокнот» did not end Notepad" }
            Write-Host "command «закрой блокнот»: Notepad ended"
            $cmdOk = "PASS"
          } catch { $cmdWhy = $_.Exception.Message }
          # a timer must end with an event: «поставь таймер на 5 секунд» -> after five seconds the notification of Jarvis exists
          # (kind «timer»; «spoken» says whether the voice was asked to say it — that it is HEARD is not tested here: no sound card)
          $timerOk = "FAIL"; $timerWhy = ""
          try {
            Ask "поставь таймер на 5 секунд" | Out-Null
            $found = $null
            for ($i = 0; $i -lt 40 -and -not $found; $i++) {
              Start-Sleep 1
              $st2 = Invoke-RestMethod http://127.0.0.1:9714/state -TimeoutSec 5
              $found = @($st2.notes) | Where-Object { $_.kind -eq "timer" } | Select-Object -First 1
            }
            if (-not $found) {
              $kinds = (@($st2.notes) | ForEach-Object { "$($_.kind):$($_.title)" }) -join ", "
              throw "no notification of kind timer appeared in 40 s; last output of Jarvis: '$($st2.last_output)'; notifications: [$kinds]"
            }
            $timerOk = "PASS"; $timerWhy = "notification: '$($found.title)' / '$($found.text)', shown=$($found.shown), spoken=$($found.spoken)"
          } catch { $timerWhy = $_.Exception.Message }
          Write-Host "TIMER E2E: $timerOk $timerWhy"
          Add-Content evidence.txt "TIMER E2E (a 5-second timer rings through the real queue): $timerOk $timerWhy"
          if ($timerOk -ne "PASS") { Write-Output "::warning title=timer e2e::$timerWhy" }
          Write-Host "COMMANDS E2E: $cmdOk $cmdWhy"
          Add-Content evidence.txt "COMMANDS E2E (open and close Notepad through the real queue): $cmdOk $cmdWhy"
          if ($cmdOk -ne "PASS") { Write-Output "::warning title=commands e2e::$cmdWhy" }
          # The access from any network: a REAL Cloudflare quick tunnel from this machine (download, hash and signature of
          # cloudflared, the process, the public address, the page, the secret and the throttle through it). The network
          # of the runner can fail, so a failure here is a loud warning and "TUNNEL E2E: FAIL" in the log, not a stop.
          $tun = "FAIL"; $why = ""; $tunOn = $false
          function Get-Tunnel { (Invoke-RestMethod http://127.0.0.1:9714/remote -TimeoutSec 5).tunnel }
          function Wait-Tunnel($secs) {
            $t0 = Get-Date
            while (((Get-Date) - $t0).TotalSeconds -lt $secs) {
              Start-Sleep 3
              $tn = Get-Tunnel
              if ($tn.state -eq "error") { throw "tunnel error: $($tn.error)" }
              if ($tn.state -eq "on") { Write-Host "tunnel address ready after $([int]((Get-Date) - $t0).TotalSeconds) s"; return $tn.url }
            }
            throw "no public address in $secs s"
          }
          try {
            Invoke-RestMethod http://127.0.0.1:9714/action -Method Post -Headers $h -Body '{"name":"remote_on"}' | Out-Null
            Invoke-RestMethod http://127.0.0.1:9714/action -Method Post -Headers $h -Body '{"name":"remote_tunnel","value":true}' | Out-Null
            $url = Wait-Tunnel 300
            $base = $url.Split('?')[0].TrimEnd('/'); $tok = $url.Split('=')[-1]
            $page = $null
            for ($i = 0; $i -lt 20 -and -not $page; $i++) { try { $page = Invoke-WebRequest $base -TimeoutSec 15 -UseBasicParsing } catch { Start-Sleep 3 } }
            if (-not $page -or $page.StatusCode -ne 200 -or $page.Content -notlike "*<html*") { throw "the page did not open through the tunnel" }
            Write-Host "the page opens through the tunnel"
            # the status code of a request (a refusal 403/401/429 is an answer; other errors may be the edge of Cloudflare still warming up)
            function Get-Code($u, $hdr) {
              for ($k = 0; $k -lt 6; $k++) {
                try { $r = Invoke-WebRequest $u -Headers $hdr -TimeoutSec 15 -UseBasicParsing; return [int]$r.StatusCode }
                catch { $c = [int]$_.Exception.Response.StatusCode; if ($c -in 401, 403, 429) { return $c }; Start-Sleep 3 }
              }
              return -1
            }
            $c1 = Get-Code "$base/poll?after=0" @{}
            Write-Host "request without the secret through the tunnel: HTTP $c1"
            if ($c1 -ne 403) { throw "SECURITY: a request without the secret got HTTP $c1 through the tunnel (403 expected)" }
            $pr = Invoke-WebRequest "$base/poll?after=0" -Headers @{ "X-Token" = $tok } -TimeoutSec 15 -UseBasicParsing
            if ($pr.StatusCode -ne 200) { throw "the request with the secret failed through the tunnel" }
            Write-Host "without the secret: refused; with the secret: answered"
            # The contract: wrong secrets from one sender are answered 403 and, from the eleventh in a minute, 429. Only answers of
            # Jarvis count (a lost request, a timeout or an answer of the Cloudflare edge itself never reached the counter), so a
            # hiccup of the network cannot fake a failure, and a missing 429 after plenty of real answers is a SECURITY failure.
            $answered = 0; $got429 = $false; $codes = @()
            for ($n = 0; $n -lt 60 -and -not $got429; $n++) {
              $c = 0
              try { $r = Invoke-WebRequest "$base/poll?after=0" -Headers @{ "X-Token" = "0000000000000000" } -TimeoutSec 15 -UseBasicParsing; $c = [int]$r.StatusCode }
              catch { if ($_.Exception.Response) { $c = [int]$_.Exception.Response.StatusCode } }
              $codes += $c
              if ($c -eq 403) { $answered++ } elseif ($c -eq 429) { $got429 = $true } elseif ($c -eq 200) { throw "SECURITY: a wrong secret was answered 200 through the tunnel" }
            }
            Write-Host "wrong secrets (answers of Jarvis: $answered 403, then 429: $got429): $($codes -join ',')"
            if (-not $got429) {
              if ($answered -ge 12) { throw "SECURITY: $answered wrong secrets were answered 403 and the door never closed (no 429)" }
              throw "NOT TESTED: only $answered of the wrong secrets reached Jarvis through the tunnel (the network of the runner), the throttle was not exercised"
            }
            if ($answered -lt 10) { throw "SECURITY: the door closed after only $answered wrong secrets (10 expected)" }
            # switched off: the address stops and cloudflared ends
            Invoke-RestMethod http://127.0.0.1:9714/action -Method Post -Headers $h -Body '{"name":"remote_tunnel","value":false}' | Out-Null
            Start-Sleep 2
            if ((Get-Tunnel).state -ne "off") { throw "the tunnel did not switch off" }
            if (@(Get-Process cloudflared -ErrorAction SilentlyContinue).Count -ne 0) { throw "cloudflared stayed after the switch" }
            Write-Host "switched off: cloudflared ended"
            $tun = "PASS"
          } catch { $why = $_.Exception.Message }
          Write-Host "TUNNEL E2E: $tun $why"
          Add-Content evidence.txt "TUNNEL E2E (real Cloudflare): $tun $why"
          if ($tun -ne "PASS") { Write-Output "::warning title=tunnel e2e::$why" }
          # The voice installed by the program itself (the lite installer has no Piper): the download of the pinned Piper archive, its
          # SHA-256 and the names inside it checked, the unpacking through the one PowerShell gate (psrun), the voice files checked.
          # This is the only place where that real path runs on Windows. A refusal of the checks is a SECURITY failure; a missing
          # network (the runner) is NOT TESTED.
          $vi = "NOT TESTED"; $viWhy = ""
          try {
            $r = Invoke-RestMethod http://127.0.0.1:9714/action -Method Post -Headers $h -Body '{"name":"voice_install"}'
            if (-not $r.ok) { throw "NOT TESTED: the install did not start: $($r.message)" }
            $st = $null
            for ($i = 0; $i -lt 150; $i++) { Start-Sleep 4; $st = Invoke-RestMethod http://127.0.0.1:9714/voice-install -TimeoutSec 10; if (-not $st.running) { break } }
            if ($st.running) { throw "NOT TESTED: still running after 10 minutes" }
            if ($st.error) {
              if ($st.error -match 'SHA-256|закреплённ|отклонен|не прошёл проверку') { throw "SECURITY: the checks refused the download: $($st.error)" }
              throw "NOT TESTED: $($st.error)"
            }
            if (-not ($st.done -and $st.installed)) { throw "the install ended without an error but the voice is not installed (done=$($st.done), installed=$($st.installed))" }
            foreach ($f in @("piper\piper.exe")) { if (-not (Test-Path (Join-Path $dir $f))) { throw "missing after the install: $f" } }
            if (@(Get-ChildItem (Join-Path $dir "piper\voices") -Filter *.onnx -ErrorAction SilentlyContinue).Count -lt 1) { throw "no voice model after the install" }
            $zip = Join-Path $dir "jarvis_piper.zip"
            if (Test-Path $zip) { throw "the downloaded archive was not removed" }
            $vi = "PASS"; $viWhy = "voice_pinned=$($st.voice_pinned) (false: the voice files are checked by shape only, no hash is pinned for them yet)"
          } catch {
            $viWhy = $_.Exception.Message
            $vi = if ($viWhy -like "SECURITY:*") { "FAIL" } elseif ($viWhy -like "NOT TESTED:*") { "NOT TESTED" } else { "FAIL" }
          }
          Write-Host "VOICE INSTALL E2E: $vi $viWhy"
          Add-Content evidence.txt "VOICE INSTALL E2E (the voice from the program: download, SHA-256, names, unpack through psrun): $vi $viWhy"
          if ($vi -ne "PASS") { Write-Output "::warning title=voice install e2e::$viWhy" }
          # on again, and left ON for the exit below: the full exit must end cloudflared too (checked after it)
          try {
            Invoke-RestMethod http://127.0.0.1:9714/action -Method Post -Headers $h -Body '{"name":"remote_tunnel","value":true}' | Out-Null
            Wait-Tunnel 300 | Out-Null; $tunOn = $true
          } catch { Write-Host "the tunnel could not be switched on again: $($_.Exception.Message)" }
          Write-Host "cloudflared processes before the exit: $(@(Get-Process cloudflared -ErrorAction SilentlyContinue).Count)"
          # every card of the diagnostics of the installed Jarvis on this runner (what is PASS has its proof in the card)
          try {
            Invoke-RestMethod http://127.0.0.1:9714/action -Method Post -Headers $h -Body '{"name":"diag_run"}' | Out-Null
            $dj = $null
            for ($i = 0; $i -lt 90; $i++) { Start-Sleep 1; $dj = Invoke-RestMethod http://127.0.0.1:9714/diag -TimeoutSec 5; if (-not $dj.running -and $dj.checks) { break } }
            foreach ($c in $dj.checks) {
              $d = "$($c.detail)"; if ($d.Length -gt 170) { $d = $d.Substring(0, 170) + "…" }
              Write-Host "DIAG [$($c.status)] $($c.name): $d"
              Add-Content evidence.txt "DIAG [$($c.status)] $($c.name): $d"
            }
          } catch { Write-Host "DIAG could not be read: $($_.Exception.Message)"; Add-Content evidence.txt "DIAG could not be read: $($_.Exception.Message)" }
          # without the X-Jarvis header nothing is done (a web page cannot close Jarvis)
          try { Invoke-RestMethod http://127.0.0.1:9714/action -Method Post -Body '{"name":"app_exit"}' | Out-Null; throw "app_exit without the header was accepted" } catch { if ($_.Exception.Message -like "*without the header*") { throw } }
          Start-Sleep 1
          if ($app.HasExited) { throw "Jarvis ended on a request without the header" }
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $r = Invoke-RestMethod http://127.0.0.1:9714/action -Method Post -Headers $h -Body '{"name":"app_exit"}'
          Write-Host "app_exit: $($r | ConvertTo-Json -Compress)"
          if (-not $app.WaitForExit(15000)) { throw "Jarvis did not end after the full exit" }
          Write-Host "Jarvis ended after the full exit in $([int]$sw.Elapsed.TotalMilliseconds) ms, exit code $($app.ExitCode)"
          if ($sw.Elapsed.TotalSeconds -gt 5) { Write-Output "::warning title=exit::the full exit took $([int]$sw.Elapsed.TotalSeconds) s" }
          if (@(Get-Process jarvis-app -ErrorAction SilentlyContinue).Count -ne 0) { throw "a jarvis-app process is still running" }
          Start-Sleep 2
          $left = @(Get-Process cloudflared -ErrorAction SilentlyContinue).Count
          Write-Host "cloudflared processes after the full exit (tunnel was on: $tunOn): $left"
          if ($left -ne 0) { throw "the full exit left cloudflared running" }
          # an update over a running Jarvis (it may sit hidden in the tray): the installer closes it and installs
          $app = Start-Process "$dir\jarvis-app.exe" -ArgumentList "--background" -WorkingDirectory $dir -PassThru
          for ($i = 0; $i -lt 90; $i++) { Start-Sleep 1; try { Invoke-RestMethod http://127.0.0.1:9714/state -TimeoutSec 3 | Out-Null; break } catch {} }
          $p = Start-Process dist\Jarvis-Setup-Lite.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$dir", "/LOG=$PWD\update.log" -PassThru -Wait
          Write-Host "update over the running Jarvis: installer exit code $($p.ExitCode); old Jarvis ended: $($app.HasExited)"
          Select-String -Path update.log -Pattern "Closing|close|Restart Manager|in use" | Select-Object -First 10 | ForEach-Object { "  " + $_.Line }
          if (-not $app.HasExited) { $app.Kill(); throw "the installer did not close the running Jarvis" }
          if ($p.ExitCode -ne 0) { throw "the update over the running Jarvis failed" }
          $log = Get-ChildItem "$env:APPDATA", "$env:LOCALAPPDATA" -Recurse -Depth 3 -Filter log.txt -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*jarvis*" } | Sort-Object LastWriteTime | Select-Object -Last 1
          if ($log) {
            Write-Host "=== $($log.FullName)"
            Select-String -Path $log.FullName -Pattern "Window:|UI:|Exit requested|Microphone|instance|show" | Select-Object -Last 30 | ForEach-Object { $_.Line }
          } else { Write-Host "log.txt not found" }

  # The release "build-latest": only from main and only when BOTH the tests and the build passed.
  # dev/* branches stop before this job (the check of a branch is never published).
      # everything the real-Windows checks found, in one place (read the end of this job)
      - name: Evidence summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path evidence.txt) { Write-Host "===== EVIDENCE ====="; Get-Content evidence.txt -Encoding UTF8 } else { Write-Host "no evidence file" }
          # The security checks are a GATE: a failed one fails the job (a warning in a green pipeline hid a missing 429 once).
          # "NOT TESTED" (the network of the runner) is not a failure of security and stays a visible warning.
          if (Test-Path evidence.txt) {
            $gate = @(Get-Content evidence.txt -Encoding UTF8 | Where-Object { ($_ -match '^(UI AUTH|DATA ACL|INSTALL FOLDER ACL)' -and $_ -match ': FAIL') -or ($_ -match '^(TUNNEL E2E|VOICE INSTALL E2E)' -and $_ -match 'SECURITY:') })
            if ($gate.Count -gt 0) { $gate | ForEach-Object { Write-Output "::error title=security check failed::$_" }; throw "SECURITY CHECKS FAILED: $($gate.Count)" }
          }

  # The license server and the shared licensing library: their tests are the checklist of the licensing (online-only activation,
  # one key = one installation, signed tokens, calendar subscriptions, renewal, revocation, audit). Nothing here needs Windows.
  license-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: license
      - name: Tests of the licensing library and the license server
        run: |
          cargo test -p jarvis-license --features server
          cargo test -p jarvis-license-server
      - name: The customer's program must not contain the signing code or the server
        run: |
          # cargo tree shows what jarvis-app (Jarvis User) is built from: no `server` feature of jarvis-license, no server crates
          cargo tree -p jarvis-app --features user-edition -e features -i jarvis-license > tree-features.txt
          cat tree-features.txt
          if grep -q 'feature "server"' tree-features.txt; then echo "::error title=user build::the signing code (feature server) is in the customer's program"; exit 1; fi
          cargo tree -p jarvis-app --features user-edition -e normal > tree-normal.txt
          if grep -Eq 'jarvis-license-server|rusqlite|tiny_http' tree-normal.txt; then echo "::error title=user build::the license server is in the customer's program"; exit 1; fi

  # Jarvis User: the customer's program (levels enforced, no license manager) and its installer. The program is built with the PUBLIC key
  # and the address of the license server (repository variables JARVIS_LICENSE_PUBKEY and JARVIS_LICENSE_URL); no secret is needed
  # or used here. The installer is a separate artifact: it is NOT put on the release of the owner's build.
  build-user:
    needs: stamp
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: user
      - name: Tests with the user edition (levels are enforced)
        shell: pwsh
        run: |
          $env:LIB = "$PWD\lib\windows\amd64;$env:LIB"
          $env:PATH = "$PWD\lib\windows\amd64;$env:PATH"
          cargo test -p jarvis-core --features user-edition --no-fail-fast 2>&1 | Tee-Object -FilePath test-user.log
          if ($LASTEXITCODE -ne 0) {
            $found = Select-String -Path test-user.log -Pattern 'error(\[E\d+\])?:|panicked|FAILED|failures:|test result' -Context 0,4 | Select-Object -First 40
            $text = (($found | ForEach-Object { $_.Line; $_.Context.PostContext }) -join "`n")
            if ($text.Length -gt 30000) { $text = $text.Substring(0, 30000) }
            $text = $text.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            Write-Output "::error title=cargo test (user edition)::$text"
            exit 1
          }
      - name: Build jarvis-app (release, user edition)
        shell: pwsh
        env:
          JARVIS_LICENSE_PUBKEY: ${{ vars.JARVIS_LICENSE_PUBKEY }}
          JARVIS_LICENSE_URL: ${{ vars.JARVIS_LICENSE_URL }}
          # updates: the address of update.json and the PUBLIC key of the owner (repository variables; no secret)
          JARVIS_UPDATE_URL: ${{ vars.JARVIS_UPDATE_URL }}
          JARVIS_UPDATE_PUBKEY: ${{ vars.JARVIS_UPDATE_PUBKEY }}
        run: |
          $env:LIB = "$PWD\lib\windows\amd64;$env:LIB"
          $env:JARVIS_BUILD_SHA = "${{ github.sha }}"
          if (-not $env:JARVIS_LICENSE_PUBKEY -or -not $env:JARVIS_LICENSE_URL) { Write-Output "::warning title=license::JARVIS_LICENSE_PUBKEY / JARVIS_LICENSE_URL are not set: this Jarvis User cannot activate Premium (a build for tests only)" }
          cargo build --release -p jarvis-app --features user-edition
      - name: Sign jarvis-app.exe (user edition)
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ./installer/sign.ps1 target\release\jarvis-app.exe
      - name: The customer's program carries no secret and no administrator code
        shell: pwsh
        run: |
          $exe = "target\release\jarvis-app.exe"
          $text = [System.Text.Encoding]::GetEncoding(28591).GetString([System.IO.File]::ReadAllBytes($exe))
          $utf = [System.Text.Encoding]::UTF8.GetString([System.IO.File]::ReadAllBytes($exe))
          $bad = @()
          # markers of the administrator's code, of the server and of private keys; none may be in the customer's program
          foreach ($m in @("jla_", "license-admin", "page-licmgr", "JARVIS_LS_SIGNING_KEY", "JARVIS_LS_PEPPER", "BEGIN PRIVATE KEY", "BEGIN OPENSSH PRIVATE KEY", "BEGIN EC PRIVATE KEY")) {
            if ($text.Contains($m)) { $bad += $m }
          }
          foreach ($m in @("Создать ключи (Keygen)", "Токен администратора")) { if ($utf.Contains($m)) { $bad += $m } }
          if ($bad.Count -gt 0) { Write-Output "::error title=secret scan::found in the customer's program: $($bad -join ', ')"; exit 1 }
          Write-Output "secret scan: clean ($((Get-Item $exe).Length) bytes)"
      - name: Assemble program folder
        shell: pwsh
        run: |
          $out = "build\JarvisUser"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item target\release\jarvis-app.exe $out
          Copy-Item lib\windows\amd64\*.dll $out
          foreach ($d in "commands", "sound", "keywords", "rustpotter") { Copy-Item "resources\$d" "$out\resources\$d" -Recurse }
          New-Item -ItemType Directory -Force "$out\resources\vosk" | Out-Null
          Copy-Item resources\vosk\README.md "$out\resources\vosk"
      - name: Build the installer (Jarvis-User-Setup.exe)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          New-Item -ItemType Directory -Force dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DUserEdition=1 /DSrcDir=build\JarvisUser /DOutName=Jarvis-User-Setup /DBuildSha=$($env:GITHUB_SHA.Substring(0,7)) /DBuildDate=$(Get-Date -Format 'yyyy-MM-dd') installer\jarvis.iss 2>&1 | Tee-Object -FilePath iscc-user.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist | Format-Table Name, Length
      - name: Sign the installer (user edition)
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ./installer/sign.ps1 dist\Jarvis-User-Setup.exe
      - name: Upload Jarvis User installer
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-User-${{ needs.stamp.outputs.label }}
          path: dist/Jarvis-User-Setup.exe
          if-no-files-found: error

  # The Docker image of the license server (deploy/docker): it builds, makes its database and keys at the first start, answers /health,
  # keeps the keys in the volume, does not run as root. The image is not published anywhere; the deployment is the owner's step.
  license-server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -f deploy/docker/Dockerfile -t jarvis-license:ci .
      - name: It starts, answers /health and survives a restart with the same key
        run: |
          set -e
          docker volume create ls-ci >/dev/null
          docker run -d --name ls -v ls-ci:/data jarvis-license:ci
          for i in $(seq 1 30); do
            if docker exec ls curl -fsS http://127.0.0.1:8787/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          [ "${ok:-0}" = 1 ] || { docker logs ls; echo "::error title=license-server-image::no answer on /health"; exit 1; }
          key1=$(docker exec ls jarvis-license-server public-key)
          [ -n "$key1" ]
          docker exec ls jarvis-license-server admin-create ci | grep -q "jla_"
          [ "$(docker exec ls id -u)" != 0 ] || { echo "::error title=license-server-image::the container runs as root"; exit 1; }
          docker restart ls >/dev/null
          for i in $(seq 1 30); do docker exec ls curl -fsS http://127.0.0.1:8787/health >/dev/null 2>&1 && break; sleep 1; done
          key2=$(docker exec ls jarvis-license-server public-key)
          [ "$key1" = "$key2" ] || { echo "::error title=license-server-image::the signing key changed after a restart"; exit 1; }
          echo "image ok, public key stable: $key1"

  # An experimental build of Jarvis with the aim assist on the video card (DirectML). It is NOT an installer: the program file and the
  # libraries that go with it, to try on a computer with a video card (replace jarvis-app.exe in the folder of an installed Jarvis).
  # The runner has no video card, so this job proves that the build compiles and links and that the model still runs (on the
  # processor) with DirectML switched on; whether the video card is faster is for the owner to see on a real computer.
  build-directml:
    needs: stamp
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: directml
      - name: Build jarvis-app with DirectML (release)
        shell: pwsh
        run: |
          $env:LIB = "$PWD\lib\windows\amd64;$env:LIB"
          $env:JARVIS_BUILD_SHA = "${{ github.sha }}"
          cargo build --release -p jarvis-app --features directml
      - name: Tests of the aim assist with DirectML switched on (informational)
        shell: pwsh
        continue-on-error: true
        run: |
          $env:LIB = "$PWD\lib\windows\amd64;$env:LIB"
          $env:PATH = "$PWD\lib\windows\amd64;$env:PATH"
          cargo test -p jarvis-core --features directml -- aim --nocapture 2>&1 | Tee-Object -FilePath test-directml.log
          exit $LASTEXITCODE
      - name: Sign jarvis-app.exe (DirectML)
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ./installer/sign.ps1 target\release\jarvis-app.exe
      - name: Collect the files
        shell: pwsh
        run: |
          $out = "build\JarvisDirectML"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item target\release\jarvis-app.exe $out
          # the libraries that the build put beside the program (DirectML.dll and the like), if any
          Get-ChildItem target\release\*.dll -ErrorAction SilentlyContinue | Copy-Item -Destination $out
          Copy-Item lib\windows\amd64\*.dll $out -ErrorAction SilentlyContinue
          Set-Content "$out\README.txt" "Jarvis with the aim assist on the video card (DirectML), build ${{ github.sha }}. Experimental: close Jarvis, copy these files over the ones in the folder of the installed Jarvis (a copy of the folder first), start it, choose Device = Video card in Games - Aim assist. If it does not start on the video card, Jarvis uses the processor and says so in the report."
          Get-ChildItem $out | Format-Table Name, Length
      - name: Upload DirectML build
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-DirectML-${{ needs.stamp.outputs.label }}
          path: build/JarvisDirectML
          if-no-files-found: error

  # The license server for Windows: a local test copy (127.0.0.1) to try the license manager of Jarvis Admin on the computer of the owner.
  # Not a production server (no HTTPS): see docs/licensing/DEPLOYMENT.md.
  license-server-windows:
    needs: stamp
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: license-server-windows
      - name: Build jarvis-license-server (release)
        shell: pwsh
        run: cargo build --release -p jarvis-license-server
      - name: Assemble the local test folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force license-server-local | Out-Null
          Copy-Item target\release\jarvis-license-server.exe license-server-local
          Copy-Item deploy\local-license-server.ps1 license-server-local
          Copy-Item deploy\LOCAL-SERVER-README.txt license-server-local
          Get-ChildItem license-server-local | Format-Table Name, Length
      - name: Upload the license server (local test)
        uses: actions/upload-artifact@v4
        with:
          name: LicenseServer-${{ needs.stamp.outputs.label }}
          path: license-server-local
          if-no-files-found: error

  # The old Tauri window (crates/jarvis-gui) is NOT part of the shipped program: the installer carries jarvis-app.exe only, and the
  # tray of jarvis-app can start a jarvis-gui.exe that stands next to it, if one is there. This job only tells whether the crate
  # still builds (it needs the Tauri libraries, which the Linux development environment lacks). It does not block anything.
  gui-check:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gui-check
      - name: cargo check -p jarvis-gui (informational)
        shell: pwsh
        run: |
          cargo check -p jarvis-gui --color never 2>&1 | Out-File gui-check.log -Encoding utf8
          $code = $LASTEXITCODE
          # the errors themselves (the last lines of cargo are only the warnings)
          Select-String -Path gui-check.log -Pattern '^error' -Context 0,12 | ForEach-Object { Write-Host $_.Line; $_.Context.PostContext | ForEach-Object { Write-Host $_ } }
          if ($code -ne 0) { Write-Output "::warning title=jarvis-gui::the crate does not build (informational, not part of the shipped program)"; exit 1 }

  publish:
    needs: [test, build, stamp]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # one publication at a time; a newer run waits for the one in progress
    concurrency:
      group: publish-build-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Jarvis-${{ needs.stamp.outputs.label }}
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: jarvis-app-${{ needs.stamp.outputs.label }}
          path: build/Jarvis

      # main moved on while this run was building: the newer commit is published by its own run,
      # an older build never replaces a newer one
      - name: Is this still the latest commit of main?
        id: fresh
        shell: bash
        run: |
          git fetch --depth=1 origin main
          if [ "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main is already at $(git rev-parse --short FETCH_HEAD), this build of ${GITHUB_SHA::7} is not published"
          fi

      # the tag points at the commit the files are built from (the "Source code" of the release matches them)
      - name: Move tag build-latest to this commit
        if: steps.fresh.outputs.latest == 'true'
        shell: bash
        run: |
          git tag -f build-latest "$GITHUB_SHA"
          git push -f origin refs/tags/build-latest

      - name: Publish to release "build-latest"
        if: steps.fresh.outputs.latest == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-latest
          name: Latest build (installer)
          body: |
            Automatic Windows build of the latest commit. Jarvis-Setup.exe (with the Piper neural voice) or Jarvis-Setup-Lite.exe (smaller, Windows voices only). jarvis-app.exe alone (about 30 MB) replaces the program in an already installed Jarvis (no need to download the installer again). commands-update.zip (tiny) - unpack into the resources folder of an installed Jarvis to get new commands.

            Commit: ${{ github.sha }} (tests and build passed, run ${{ github.run_id }})
          files: |
            dist/Jarvis-Setup.exe
            dist/Jarvis-Setup-Lite.exe
            build/Jarvis/jarvis-app.exe
            dist/commands-update.zip

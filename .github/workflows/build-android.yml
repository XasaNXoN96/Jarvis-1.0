name: Build Android app

# The Android application of the remote (android/): the page of the computer inside a WebView + the speech recognizer, the battery
# and the screen lock of the phone. It is built on its own, so a problem of the Android part never stops the Windows build.
on:
  push:
    branches: [main, "dev/**"]
    paths:
      - 'android/**'
      - 'crates/jarvis-core/src/remote_page.html'
      - 'crates/jarvis-core/src/orbkit.js'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept the Android SDK licenses
        shell: bash
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build the APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Name the package with the date and the time (Tashkent, UTC+5)
        id: s
        shell: bash
        run: |
          label="$(TZ=Asia/Tashkent date +%d.%m.%Y_%H-%M)_${GITHUB_SHA::7}"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Jarvis-Android-${label}.apk"
          echo "label=${label}" >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: Check the APK (a signed package of the right application)
        shell: bash
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/aapt" dump badging dist/*.apk | grep -E "^package:|sdkVersion|uses-permission" 
          "$BT/apksigner" verify --print-certs dist/*.apk | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Android-${{ steps.s.outputs.label }}
          path: dist/*.apk

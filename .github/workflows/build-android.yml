name: Build Android app

# The Android application of the remote (android/): the page of the computer inside a WebView + the speech recognizer, the battery
# and the screen lock of the phone. It is built on its own, so a problem of the Android part never stops the Windows build.
on:
  push:
    branches: [main, "dev/**"]
    paths:
      - 'android/**'
      - 'crates/jarvis-core/src/remote_page.html'
      - 'crates/jarvis-core/src/orbkit.js'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      release:
        description: "Build the RELEASE package (needs the signing key from the protected secrets; fails clearly without it)"
        type: boolean
        default: false

# A push builds only the DEBUG package (signed by the debug key of the Android toolchain, named ...-DEBUG, NOT for distribution).
# The RELEASE package is built only on request (Run workflow -> release) and only with the owner's own key from the protected secrets
# (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS). Without them the release build FAILS with a clear message:
# the old key of the repository is public and is never used.
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      WANT_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept the Android SDK licenses
        shell: bash
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Test the Java part of the application
        working-directory: android
        run: gradle --no-daemon testReleaseUnitTest

      - name: Require and prepare the release signing key
        if: env.WANT_RELEASE == 'true'
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error title=Android release key missing::The release build needs the protected secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS. They are not set, so no release package is built. The old public key of the repository is NOT used. See docs/implementation/SECURITY_FIXES.md (Android signing key)."
            exit 1
          fi
          umask 077
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "::add-mask::$KS_PASS"
          echo "JARVIS_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "JARVIS_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          echo "JARVIS_KEY_ALIAS=${KS_ALIAS:-jarvis}" >> "$GITHUB_ENV"
          echo "The release package will be signed with the key from the protected secrets (its values are never printed)."

      - name: Build the APK
        working-directory: android
        run: |
          if [ "$WANT_RELEASE" = "true" ]; then gradle --no-daemon assembleRelease; else gradle --no-daemon assembleDebug; fi

      - name: List the libraries of the application (there must be no third-party one)
        working-directory: android
        run: gradle --no-daemon -q app:dependencies --configuration releaseRuntimeClasspath

      - name: Name the package with the date and the time (Tashkent, UTC+5)
        id: s
        shell: bash
        run: |
          label="$(TZ=Asia/Tashkent date +%d.%m.%Y_%H-%M)_${GITHUB_SHA::7}"
          mkdir -p dist
          if [ "$WANT_RELEASE" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "dist/Jarvis-Android-${label}.apk"
            echo "label=${label}" >> "$GITHUB_OUTPUT"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "dist/Jarvis-Android-${label}-DEBUG.apk"
            echo "label=${label}-DEBUG" >> "$GITHUB_OUTPUT"
          fi
          ls -la dist

      - name: Check the APK (a signed package of the right application)
        shell: bash
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/aapt" dump badging dist/*.apk | grep -E "^package:|sdkVersion|uses-permission"
          # the package must verify; the certificate lines are shown to compare the key with the one that was expected (the values of the key itself are never printed)
          "$BT/apksigner" verify --print-certs dist/*.apk | tee sig.txt
          test "${PIPESTATUS[0]}" -eq 0

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Android-${{ steps.s.outputs.label }}
          path: dist/*.apk

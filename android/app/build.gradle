plugins {
    id 'com.android.application'
}

android {
    namespace 'app.jarvis.remote'
    compileSdk 34

    defaultConfig {
        applicationId 'app.jarvis.remote'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    // The key of the RELEASE comes ONLY from the environment (the protected secrets of CI): JARVIS_KEYSTORE (a file), JARVIS_KEYSTORE_PASSWORD,
    // JARVIS_KEY_ALIAS, optionally JARVIS_KEY_PASSWORD. No key and no password are written here.
    // There is no fallback: the old sideload key was PUBLIC (compromised): its file is removed from the tree and it is never used. A release build without a key
    // stops with a clear error (below); a DEBUG build is signed by the debug key of the Android toolchain and is not for distribution.
    def envKey = System.getenv('JARVIS_KEYSTORE')
    signingConfigs {
        release {
            if (envKey) {
                storeFile file(envKey)
                storePassword System.getenv('JARVIS_KEYSTORE_PASSWORD')
                keyAlias System.getenv('JARVIS_KEY_ALIAS') ?: 'jarvis'
                keyPassword System.getenv('JARVIS_KEY_PASSWORD') ?: System.getenv('JARVIS_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (envKey) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
    }
}

dependencies {
    // the tests of the pure Java part (the address typed by the user); the application itself has no third-party library
    testImplementation 'junit:junit:4.13.2'
}

// a release package must never be built without the own key of the owner (no silent unsigned or publicly signed package)
gradle.taskGraph.whenReady { graph ->
    def wantsRelease = graph.allTasks.any { it.name == 'assembleRelease' || it.name == 'packageRelease' || it.name == 'bundleRelease' }
    if (wantsRelease && !System.getenv('JARVIS_KEYSTORE')) {
        throw new GradleException('Release build refused: no signing key. Add the protected secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS (docs/implementation/SECURITY_FIXES.md). The old public key of the repository is not used.')
    }
}

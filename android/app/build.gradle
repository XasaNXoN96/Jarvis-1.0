plugins {
    id 'com.android.application'
}

android {
    namespace 'app.jarvis.remote'
    compileSdk 34

    defaultConfig {
        applicationId 'app.jarvis.remote'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    // The key of the release comes ONLY from the environment (the protected secrets of CI): JARVIS_KEYSTORE (a file), JARVIS_KEYSTORE_PASSWORD,
    // JARVIS_KEY_ALIAS, optionally JARVIS_KEY_PASSWORD. No key and no password are written here.
    // JARVIS_ALLOW_LEGACY_KEY=1 uses the OLD sideload key of the repository (keystore/jarvis-sideload.jks): that key and its password are PUBLIC
    // (the repository is public), so a package signed with it proves nothing. It stays only until the owner has made his own key and moved to it
    // (docs/implementation/SECURITY_FIXES.md, "Ключ подписи Android"). Without any key the package is built unsigned.
    def envKey = System.getenv('JARVIS_KEYSTORE')
    def legacy = System.getenv('JARVIS_ALLOW_LEGACY_KEY') == '1'
    signingConfigs {
        release {
            if (envKey) {
                storeFile file(envKey)
                storePassword System.getenv('JARVIS_KEYSTORE_PASSWORD')
                keyAlias System.getenv('JARVIS_KEY_ALIAS') ?: 'jarvis'
                keyPassword System.getenv('JARVIS_KEY_PASSWORD') ?: System.getenv('JARVIS_KEYSTORE_PASSWORD')
            } else if (legacy) {
                storeFile file('../keystore/jarvis-sideload.jks')
                storePassword 'jarvis-sideload'
                keyAlias 'jarvis'
                keyPassword 'jarvis-sideload'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (envKey || legacy) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
    }
}

dependencies {
    // the tests of the pure Java part (the address typed by the user); the application itself has no third-party library
    testImplementation 'junit:junit:4.13.2'
}
